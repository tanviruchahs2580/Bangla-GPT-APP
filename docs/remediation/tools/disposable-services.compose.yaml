name: bgpt-remediation-020
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bgpt_remediation
      POSTGRES_USER: bgpt_remediation
      POSTGRES_PASSWORD: ${BGPT_REMEDIATION_PG_PASSWORD:?set a per-run dummy password}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
