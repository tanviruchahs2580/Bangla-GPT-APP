name: bangla-gpt-app

# Profiles:
#   core        — api + redis            (docker compose --profile core up -d)
#   worker      — ARQ cron worker        (add --profile worker; set JOBS_BACKEND=arq)
#   web         — static dashboard       (add --profile web)
#   tls         — Caddy auto-HTTPS proxy (add --profile tls WITH --profile web;
#                 Caddy reverse-proxies web:80, so `--profile tls` alone is an
#                 invalid project: "caddy depends on undefined service web".
#                 Requires DOMAIN/ACME_EMAIL)
#   postgres    — Postgres service       (add --profile postgres)
#   monitoring  — Prometheus + Grafana   (add --profile monitoring)
#   backup      — scheduled DB backups   (add --profile backup)

x-api-common: &api-common
  restart: unless-stopped
  expose:
    - "8000"

services:
  api:
    <<: *api-common
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [core]
    environment:
      ENV: ${ENV:-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # IP-scoped rate limits must key on the real client, not the proxy.
      # True is safe HERE (and is the shipped default) because the bundled
      # Caddy OVERWRITES X-Forwarded-For with its observed peer address
      # (deploy/caddy/Caddyfile, `header_up X-Forwarded-For {remote_host}`)
      # and the API trusts only the last entry. Set it to false in front of
      # a proxy that APPENDS instead — an appending proxy plus this flag
      # lets callers choose their own rate-limit identity. The pairing is
      # machine-checked by apps/api/scripts/check_proxy_contract.py.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # DATA-001: 4 MB fits the wave-2 vision contract (~2 MB base64 image
      # JSON per chat turn); smaller values 413 valid image turns.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-4000000}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      FORCE_ADMIN_PASSWORD_CHANGE: ${FORCE_ADMIN_PASSWORD_CHANGE:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_TUTOR_PER_MINUTE: ${RATE_LIMIT_TUTOR_PER_MINUTE:-30}
      RATE_LIMIT_TUTOR_IP_PER_MINUTE: ${RATE_LIMIT_TUTOR_IP_PER_MINUTE:-60}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-8}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-180}
      INVITE_TTL_MINUTES: ${INVITE_TTL_MINUTES:-1440}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_BACKEND: ${JOBS_BACKEND:-inline}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NCTB_CORPUS_DIR: ${NCTB_CORPUS_DIR:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - api_data:/data
    # Host-side port. This is for a tunnel or proxy that runs ON THE HOST, not
    # on the Compose network -- Caddy reaches the API as `api:8000` and never
    # uses this mapping.
    #
    # It used to read "${API_HOST_PORT:-}:8000" with a comment saying the port
    # was published "ONLY when API_HOST_PORT is set". That was wrong: Compose
    # renders an empty host segment as a full port entry, so an unset variable
    # published the API on a RANDOM host port bound to 0.0.0.0 -- not the
    # private posture the comment, the README and the runbook all promised, and
    # a deployed API did end up listening on every interface that way.
    #
    # Now it is deterministic and bound to loopback unless the operator asks for
    # wider: API_HOST_PORT picks the port (default 8000), API_HOST_BIND the
    # interface. That default is what a host-side tunnel or a `curl
    # 127.0.0.1:8000/health` from the host uses. The release workflow's
    # post-deploy gate does not depend on it -- that reads the api container's
    # own healthcheck, so it cannot fail a healthy release over a mapping the
    # operator left out.
    # Widen only deliberately: API_HOST_BIND=0.0.0.0 exposes the API to the
    # network, and nothing in the stack authenticates the client at that layer.
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    # service_healthy, not service_started: the rate limiter fails CLOSED on
    # a dead backend (F-08), so an API booting against a not-yet-ready Redis
    # answered 503s for the first seconds of its life.
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The API is mostly event loop + worker threads; 1 GB / 1 CPU is
          # the measured headroom for 2 web workers with the corpus index.
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Pinned by digest (audit F9): a floating tag can change under a rebuild
    # without any commit. Update with scripts/update_image_digests.py.
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    profiles: [core]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # Not exposed to the host on purpose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.5"

  # S5.4: ARQ cron worker. Run INSTEAD of the in-process loops: set
  # JOBS_BACKEND=arq on the api service so its web workers stop scheduling,
  # and start exactly ONE of these (job_runs still guarantees no double runs).
  worker:
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [worker]
    restart: unless-stopped
    working_dir: /app/apps/api
    command: ["arq", "worker.WorkerSettings"]
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_BACKEND: arq
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - api_data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/web:${WEB_TAG:-local}
    profiles: [web]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  postgres:
    # S5.7: postgres 16 + pgBackRest binary (archive-push runs inside this
    # container); the pgbackrest sidecar shares the socket + repo volumes.
    build: ./deploy/postgres
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-bgpt}
    command:
      [
        "postgres",
        "-c", "wal_level=replica",
        "-c", "archive_mode=on",
        "-c", "archive_command=pgbackrest --stanza=bgpt archive-push %p",
        "-c", "archive_timeout=60",
      ]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_sock:/var/run/postgresql
      - pgbackrest_repo:/repo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # METRICS_TOKEN as a file: the scrape config reads it via
      # bearer_token_file. Without this mount the scrape answered 403 in
      # production and every bgpt_* alert silently had no data (audit F4).
      - ./deploy/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # Alert delivery. Without it the rules in alerts.yml had no route to a
  # human — the two production outages were found by users, not monitoring.
  # `--config.expand-env=true` lets the SMTP settings come from the same
  # environment the API uses. Alerts go to ALERT_EMAIL_TO.
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--config.expand-env=true"
      - "--storage.path=/alertmanager"
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      # Provisioning was previously absent: dashboards and the Prometheus
      # datasource needed a hand import, and the shipped dashboard queried
      # metric names that do not exist — so monitoring "worked" while every
      # panel rendered no data (audit H-05).
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  backup:
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [backup]
    restart: unless-stopped
    entrypoint: ["python", "/srv/scripts/backup_loop.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      OFFSITE_SYNC_CMD: ${OFFSITE_SYNC_CMD:-}
    volumes:
      - api_data:/data:ro
      - backup_data:/backups
      - ./scripts:/srv/scripts:ro
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  pgbackrest:
    # S5.7: nightly pgBackRest full backups (WAL archiving runs continuously
    # via the postgres service's archive_command, so effective RPO is
    # minutes, not a day). Restore drill: scripts/pgbackrest_drill.sh.
    build: ./deploy/postgres
    profiles: [backup]
    restart: unless-stopped
    user: postgres  # peer auth against the shared socket as the postgres role
    depends_on:
      postgres:
        # `required: false` so `--profile backup` alone still parses; real
        # deploys enable both profiles (postgres + backup).
        condition: service_healthy
        required: false
    environment:
      PGBR_STANZA: ${PGBR_STANZA:-bgpt}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/usr/local/bin/pgbackrest_nightly.sh"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_sock:/var/run/postgresql
      - pgbackrest_repo:/repo
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  api_data:
  alertmanager_data:
  pg_data:
  pg_sock:
  pgbackrest_repo:
  caddy_data:
  caddy_config:
  backup_data:
