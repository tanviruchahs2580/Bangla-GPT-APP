name: bangla-gpt-app

# Profiles:
#   core        Ã¢â‚¬â€œ api + redis            (docker compose --profile core up -d)
#   worker      Ã¢â‚¬â€œ ARQ cron worker        (add --profile worker; set JOBS_BACKEND=arq)
#   web         Ã¢â‚¬â€œ static dashboard       (add --profile web)
#   tls         Ã¢â‚¬â€œ Caddy auto-HTTPS proxy (add --profile tls; requires DOMAIN/ACME_EMAIL)
#   postgres    Ã¢â‚¬â€œ Postgres service       (add --profile postgres)
#   monitoring  Ã¢â‚¬â€œ Prometheus + Grafana   (add --profile monitoring)
#   backup      Ã¢â‚¬â€œ scheduled DB backups   (add --profile backup)

x-api-common: &api-common
  restart: unless-stopped
  expose:
    - "8000"

services:
  api:
    <<: *api-common
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [core]
    environment:
      ENV: ${ENV:-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # DATA-001: 4 MB fits the wave-2 vision contract (~2 MB base64 image
      # JSON per chat turn); smaller values 413 valid image turns.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-4000000}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      FORCE_ADMIN_PASSWORD_CHANGE: ${FORCE_ADMIN_PASSWORD_CHANGE:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_TUTOR_PER_MINUTE: ${RATE_LIMIT_TUTOR_PER_MINUTE:-30}
      RATE_LIMIT_TUTOR_IP_PER_MINUTE: ${RATE_LIMIT_TUTOR_IP_PER_MINUTE:-60}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-8}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-180}
      INVITE_TTL_MINUTES: ${INVITE_TTL_MINUTES:-1440}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_BACKEND: ${JOBS_BACKEND:-inline}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NCTB_CORPUS_DIR: ${NCTB_CORPUS_DIR:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - api_data:/data
    # Publish to the host ONLY when API_HOST_PORT is set (e.g. staging).
    # In production keep it unset so traffic enters through Caddy/nginx.
    ports:
      - "${API_HOST_PORT:-}:8000"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles: [core]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # Not exposed to the host on purpose.

  # S5.4: ARQ cron worker. Run INSTEAD of the in-process loops: set
  # JOBS_BACKEND=arq on the api service so its web workers stop scheduling,
  # and start exactly ONE of these (job_runs still guarantees no double runs).
  worker:
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [worker]
    restart: unless-stopped
    working_dir: /app/apps/api
    command: ["arq", "worker.WorkerSettings"]
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_BACKEND: arq
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - api_data:/data
    depends_on:
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/web:${WEB_TAG:-local}
    profiles: [web]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  postgres:
    # S5.7: postgres 16 + pgBackRest binary (archive-push runs inside this
    # container); the pgbackrest sidecar shares the socket + repo volumes.
    build: ./deploy/postgres
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-bgpt}
    command:
      [
        "postgres",
        "-c", "wal_level=replica",
        "-c", "archive_mode=on",
        "-c", "archive_command=pgbackrest --stanza=bgpt archive-push %p",
        "-c", "archive_timeout=60",
      ]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_sock:/var/run/postgresql
      - pgbackrest_repo:/repo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}

  backup:
    build: .
    image: ghcr.io/tanviruchahs2580/bangla-gpt-app/api:${API_TAG:-local}
    profiles: [backup]
    restart: unless-stopped
    entrypoint: ["python", "/srv/scripts/backup_loop.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      OFFSITE_SYNC_CMD: ${OFFSITE_SYNC_CMD:-}
    volumes:
      - api_data:/data:ro
      - backup_data:/backups
      - ./scripts:/srv/scripts:ro

  pgbackrest:
    # S5.7: nightly pgBackRest full backups (WAL archiving runs continuously
    # via the postgres service's archive_command, so effective RPO is
    # minutes, not a day). Restore drill: scripts/pgbackrest_drill.sh.
    build: ./deploy/postgres
    profiles: [backup]
    restart: unless-stopped
    user: postgres  # peer auth against the shared socket as the postgres role
    depends_on:
      postgres:
        # `required: false` so `--profile backup` alone still parses; real
        # deploys enable both profiles (postgres + backup).
        condition: service_healthy
        required: false
    environment:
      PGBR_STANZA: ${PGBR_STANZA:-bgpt}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/usr/local/bin/pgbackrest_nightly.sh"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_sock:/var/run/postgresql
      - pgbackrest_repo:/repo

volumes:
  api_data:
  pg_data:
  pg_sock:
  pgbackrest_repo:
  caddy_data:
  caddy_config:
  backup_data:


