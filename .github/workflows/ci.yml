name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # AUD-B-15: the weekly DAST baseline runs from this workflow (there is no
  # other scheduled security scan); every job but dast-baseline skips the
  # schedule event explicitly, so a weekly tick costs one ZAP job, not a full
  # CI matrix.
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The schedule trigger exists for dast-baseline only; without this guard a
    # weekly tick would run the full CI matrix against an unchanged main.
    if: github.event_name != 'schedule'
    # Size: pytest runs twice (plain + coverage) at ~8 min each on 3.12; the
    # two matrix legs run in parallel. 30 min leaves headroom, and a hung job
    # is otherwise billed for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # T-016: three tests in tests/test_cache_v2.py are skipped unless REDIS_URL
    # is set, and no job declared Redis, so cross-instance cache consistency,
    # the shared rate-limit window and cross-instance ranking-index hits -- the
    # reason Redis exists in this stack -- were never executed by any pipeline.
    # The service is declared here (both matrix legs) and REDIS_URL is set only
    # on the step that needs it, so the rest of the suite keeps running exactly
    # as it did before.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Shared-cache tests against a real Redis (T-016)
        # The three Redis-only tests in tests/test_cache_v2.py skip themselves
        # without REDIS_URL. They are run here, on the service declared on the
        # job, so the shared-cache/limiter/ranking-index behaviour is actually
        # exercised; REDIS_URL is deliberately scoped to this step because the
        # Tests/Coverage steps above must keep running exactly as before.
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/test_cache_v2.py -q

      - name: Coverage gate (branch coverage, fail_under from pyproject)
        # Coverage used to be measured by nobody: fail_under was 0, no job
        # passed --cov, and pytest-cov was not a declared dev dependency.
        run: >-
          pytest -q
          --cov=bangla_gpt_api
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
        working-directory: apps/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 14

      - name: Dependency audit (pip-audit, fail on vulnerable)
        # pip-audit exits non-zero when any vulnerability is found, so the
        # bare command already fails the gate (there is no --fail-on flag).
        #
        # setuptools is a build backend (build-system.requires), never a shipped
        # runtime dependency, but pip-audit scans the whole environment and so
        # picks up whatever setuptools the runner image happens to ship. The
        # Python 3.11 image carried 79.0.1, which PYSEC-2026-3447 flags
        # (fixed in 83.0.0), failing a leg over tooling we do not ship. Upgrade
        # to the fixed release before auditing so the gate reports real,
        # application-relevant vulnerabilities instead of runner drift.
        run: |
          python -m pip install --quiet --upgrade "setuptools>=83.0.0"
          python -m pip_audit

      - name: Alembic migration check
        # Dedicated throwaway DB (step isolation): a genuine up/down/up cycle
        # on one clean file. Must never share ./bangla_gpt.db (the app's dev
        # default store) — a collection-time import of main in the pytest step
        # above can otherwise leave a half-created schema behind.
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          rm -f /tmp/ci_migrations.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Smoke start (import app + open routes)
        # FastAPI >=0.118 keeps lazy _IncludedRouter entries in app.routes
        # (no .path attr); app.openapi() expands all registered routes.
        env:
          DATABASE_URL: sqlite:////tmp/ci_smoke.db
        run: python -c "from bangla_gpt_api.main import create_app; app = create_app(); print(len(app.openapi()['paths']), 'openapi paths ok')"

      - name: Dashboards and alerts only query exported metrics
        # AUD-HI-03 / I-02: the committed Grafana panels queried series the
        # exporter never registered (four panels rendered empty while looking
        # correct in review). This renders the app's own registry in-process
        # and fails when a panel or alert rule names an unexported bgpt_*
        # series.
        run: python scripts/check_dashboards.py

      - name: API reference is not stale
        # AUD-HI-05 / H-01: docs/API.md is generated from the app's own
        # OpenAPI schema (135 operations); this regenerates in memory and
        # diffs, so a contract change cannot land without the reference. No
        # database is needed: the generator pins DATABASE_URL to a temp file.
        run: python scripts/gen_api_docs.py --check

  postgres:
    name: Postgres engine check (alembic + API flows)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgpt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Alembic migration cycle against Postgres
        # Pin to the Postgres service: without DATABASE_URL, alembic would
        # silently run the cycle against the file-SQLite default instead.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migration drift check (alembic check)
        # The upgrade/downgrade cycle above passes even when the models and the
        # migrations disagree: on 2026-10-09 `alembic check` failed with three
        # index differences, including token_hash and code_hash being unique in
        # the ORM but not in the database, and no job here ran that command.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: alembic check

      - name: Postgres-backed API journey tests
        run: pytest tests/test_postgres_smoke.py -v

      - name: Postgres-only single-use/race tests (T-017)
        # tests/test_single_use_tokens.py says "the `postgres` CI job sets it
        # ["TEST_DATABASE_URL"]" -- but this job only ran test_postgres_smoke.py,
        # so the two AUD-0034 race tests (exactly one winner for a verification
        # code / reset token under contention, measured 40/40 double-redeemable
        # on PostgreSQL before the fix) were asserted nowhere in CI despite the
        # service being right here. TEST_DATABASE_URL is already set job-wide
        # and the alembic steps above have created the schema in bgpt_ci.
        run: pytest tests/test_single_use_tokens.py -q

      - name: Full domain suite on Postgres (engine parity)
        # BGPT_TEST_DATABASE_URL switches every default-fixture test to this
        # database, with truncation isolation between tests (see
        # tests/conftest.py). The same ~1100-test domain suite SQLite runs now
        # also runs on the engine production uses, so engine-specific drift
        # (JSON/boolean/UPSERT/transaction semantics, FK enforcement) fails CI
        # instead of surfacing after a Postgres cutover. Engine-explicit tests
        # (smoke/race above, SQLite file posture tests) keep their own engine
        # and are deselected here to avoid double-running.
        env:
          BGPT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          pytest -q \
            --deselect tests/test_postgres_smoke.py \
            --deselect tests/test_single_use_tokens.py
        # Measured locally: 1106 passed / 6 skipped on PostgreSQL. The step
        # budget covers the per-test schema-check + TRUNCATE overhead with
        # margin on a loaded runner.
        timeout-minutes: 45

  golden-eval:
    name: Golden retrieval benchmark (sample corpus)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Run golden dataset evaluation (hit@3 / grounded accuracy gate)
        run: python scripts/evaluate_golden.py

      # The 634-item eval-v2 suite + recorded baseline (any metric dropping
      # >2pp fails) and the 16-item red-team gate ran previously only in the
      # separate eval-gate workflow (push/PR) and in local test assertions;
      # they now also gate every push to main here so a retrieval regression
      # cannot merge without them. --seed-bad is deliberately NOT used: the
      # baseline is a reviewed, committed artifact (R12).
      - name: Eval-v2 regression gate (634-item golden suite vs committed baseline)
        run: python -m bangla_gpt_api.evaluation.cli

      - name: Red-team gate (16 adversarial prompts, all refused, no leakage)
        run: python -m bangla_gpt_api.evaluation.cli --redteam

  web:
    name: Web build & test (apps/web)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      # S5.6: gate the shipped dependency set (the deployed image is static
      # nginx; vite/esbuild dev-server advisories are dev-machine-only and
      # triaged in docs/security_scans.md -- run a full `npm audit` there too).
      - name: Dependency audit (npm audit, prod deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Unit tests (vitest)
        run: npx vitest run --no-file-parallelism

      # FEQ-02: the web app had no linter at all. Type-aware ESLint with
      # --max-warnings 0, so a warning fails the build rather than scrolling by.
      - name: Lint (eslint, type-aware, zero warnings)
        run: npm run lint

      # F-005: CONTRIBUTING listed `npm run format:check` in the definition
      # of done while nothing in CI ran it, and it failed on six files — a
      # stated requirement that was both unenforced and unsatisfiable. The
      # files are formatted and the check is now part of the gate, so the
      # document and the build agree.
      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (tsc + vite)
        run: npm run build

  e2e-smoke:
    name: Browser e2e smoke (Chromium, real API, mock provider)
    # AUD-EF-02 / E-10: nothing in CI drove a real browser, so a broken route,
    # auth guard or /api proxy could not fail a build. apps/web/e2e/smoke.spec.ts
    # exercises the five role journeys against the real API (LLM_PROVIDER=mock)
    # with no HTTP-level mocks; the Playwright config starts both servers
    # itself and writes junit/html/traces under the gitignored coverage/e2e/.
    # The author's local run took ~9.5 min for five journeys; 30 min leaves
    # headroom for the web build and browser install on a loaded runner.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the API (hash-verified lock)
        # Same posture as every other job: third-party wheels from the verified
        # lock, the project itself --no-deps. E2E_PYTHON below points the
        # Playwright webServer at this interpreter (the config's CI contract).
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Install web dependencies (npm ci)
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium (with OS dependencies)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Smoke journeys (five roles, mock provider)
        # The config seeds the four role accounts into a throwaway SQLite file,
        # then starts uvicorn (127.0.0.1:8000) and `vite preview` (5173) --
        # CI=true disables server reuse so a stale process on the runner can
        # never satisfy the run.
        working-directory: apps/web
        env:
          E2E_PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report, junit and failure traces
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-e2e
          path: |
            apps/web/coverage/e2e/junit.xml
            apps/web/coverage/e2e/html
            apps/web/coverage/e2e/results
          retention-days: 14

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    # 15 min covered the pre-commit and doc guards; the markdown lint, glossary
    # and quality-ratchet steps added here (jscpd over ~270 files, radon/
    # vulture/deptry over the API) need headroom on a loaded runner. A timeout
    # is not a gate: this only prevents a false red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # T-040/T-041: the pre-commit hook set was never executed by any
      # workflow -- `.pre-commit-config.yaml` claimed the hook set is a subset
      # of CI, but nothing verified that the committed tree satisfies it, and
      # on a fresh clone it did not (37 files missing a final newline, 8 with
      # trailing whitespace, 1 CRLF, all inside the old scope). CI stayed
      # green while `pre-commit install` gave every developer a red first
      # commit.
      #
      # pre-commit REWRITES the files a fixer hook repairs and then exits 1
      # ("files were modified"), so this cannot pass on a tree that violates
      # the config it ships; `--show-diff-on-failure` prints the offending
      # diff. The tool version is pinned to the one the hook revs were
      # verified against, so a new pre-commit release cannot silently change
      # the gate.
      - name: Pre-commit hooks (all files)
        env:
          PRE_COMMIT_VERSION: "4.7.0"
        run: |
          set -euo pipefail
          python -m pip install --quiet "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure

      - name: Markdown lint
        # AUD-JK-10: .markdownlint-cli2.jsonc is the tuned config (long
        # single-line prose allowed; generated CHANGELOG/docs/API.md and the
        # point-in-time docs/audit, docs/qa records excluded). The CLI version
        # is pinned to the one the tree was verified against, so a new
        # markdownlint release cannot silently change the gate.
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

      - name: Version sources agree
        # AUD-JK-12 / J-11: apps/api/pyproject.toml [project].version is the
        # single source of truth; config.py, both web package fields, the
        # README, the deployment guide and the newest CHANGELOG heading must
        # state the same version. Read-only (no --tag here: tags are an owner
        # action and legitimately lag HEAD).
        run: python3 scripts/check_version.py

      - name: Commit subjects (PR range)
        # AUD-JK-07/08, K-02: a PR's own commits are held to the documented
        # Conventional-Commits subject; structure errors and junk subjects
        # ("wip", "update", ...) fail the run. The 72-char limit is reported
        # as warnings, not errors: the hardening branch's own 13 commits are
        # 73-104 chars and history cannot be rewritten, so --strict-length
        # would pin this required job red for every PR opened from it (measured
        # in .audit/evidence/E-FIX-EF-CI-006). Tighten to --strict-length once
        # new work has been written to the limit. The SHAs travel through env,
        # never interpolated into the shell, and the range needs the
        # fetch-depth: 0 checkout above.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commits.py --range "$BASE_SHA..$HEAD_SHA"

      - name: Bangla glossary holds
        # AUD-G-05 / G-25: docs/i18n-glossary.md is the terminology source of
        # truth; an "avoid" form returning through a copy edit fails here, and
        # an approved term no string uses is reported without failing.
        run: python3 scripts/check_glossary.py

      - name: Install quality-ratchet tooling
        # The ratchet script fails closed (exit 2) when a tool is absent, so
        # the pins below are the versions the committed baselines in
        # apps/api/quality-baselines were verified against. jscpd is installed
        # into a runner-temp project (no global prefix, no repo pollution) and
        # its bin directory is added to PATH: the script resolves it as bare
        # `npx jscpd`, and npx finds a binary on PATH instead of fetching
        # latest. zizmor flags the pinned npm install as adhoc-packages (low,
        # accepted: a CLI tool has no lockfile to pin against).
        run: |
          set -euo pipefail
          python -m pip install --quiet "radon==6.0.1" "vulture==2.16" "deptry==0.25.1"
          mkdir -p "$RUNNER_TEMP/qratchet"
          cd "$RUNNER_TEMP/qratchet"
          npm init -y > /dev/null
          npm install --silent --save-exact "jscpd@5.4.1"
          echo "$RUNNER_TEMP/qratchet/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Quality ratchet (complexity, file size, dead code, deps, duplication)
        # AUD-C-03 / D-03 / D-04 / D-05: five quality dimensions were measured
        # for the audit but enforced nowhere. Each existing violation is frozen
        # in a committed baseline; a NEW violation, or growth of an existing
        # one, fails here. The baseline may only move via a justified --update
        # in the same commit.
        working-directory: apps/api
        run: python3 scripts/check_quality_ratchet.py --check

      - name: Lockfile satisfies pyproject.toml
        # The previous version of this step could not fail. It ran
        #   pip-compile --output-file constraints.txt --quiet pyproject.toml
        # *in the checkout*, overwriting the committed lock, and then read that
        # regenerated file back to assert that each dependency named in
        # pyproject.toml appeared in it -- which is true of any file compiled
        # from pyproject.toml. CONTRIBUTING.md promised "a stale lock cannot
        # slip through"; none of that was enforced.
        #
        # It was not academic. Dependabot pinned redis==8.1.0 in the lock while
        # arq -- the reason redis is capped -- requires redis[hiredis]<6. This
        # job passed in 32 s and five other jobs then died with
        # `ResolutionImpossible`, which is how the whole dependency-update queue
        # stopped landing.
        #
        # check_lockfile.py asserts the two things that are true and decidable
        # offline: every declared dependency is pinned, and the pin satisfies
        # the declared specifier. It is read-only, so it cannot repeat the
        # mistake of grading a file it just rewrote. Regex differences between
        # it and a fresh `pip-compile` are not checked: that comparison is not
        # reproducible against a live index and it failed on valid locks.
        run: python3 apps/api/scripts/check_lockfile.py

      - name: Docs agree with the code
        # "Docs-as-tests" (DOC-02): the README's endpoint table and install
        # commands are assertions about the app. This re-derives the facts they
        # depend on, so a README that drifts from the code fails the build
        # instead of quietly misleading someone at 3am.
        run: python3 apps/api/scripts/check_readme_contract.py

      - name: Every repo path a document names exists
        # A guide that tells an operator to run `scripts/pg_backup.py` when the
        # file is `pg_backup.sh` costs real time during an incident. The
        # deployment guide added in this round made exactly that mistake on its
        # first draft and 7 more existed in living docs. Scope is deliberately
        # narrow -- repo-relative paths only -- because a broader heuristic was
        # tried first and produced 463 false hits, which is how a guard gets
        # deleted.
        run: python3 apps/api/scripts/check_doc_paths.py

      - name: CHANGELOG covers every commit
        # VCS-08: the changelog is generated from git history, so it cannot
        # claim anything that did not happen. This fails if a released or
        # unreleased commit is missing from it.
        run: python3 apps/api/scripts/check_changelog.py

      - name: Secret scan (gitleaks, full history)
        # F-019: gitleaks-action v2 scans the commits present in the local
        # clone, and the default fetch-depth of 1 means that is the pushed
        # delta only. The step was named "full history" and its comment
        # repeated a claim ("82 hits on main") that a full-history run does
        # not reproduce: it finds 2, both in files deleted before the
        # baseline and both judged non-credentials. The claim is now made
        # true -- see the fetch-depth: 0 on this job's checkout, which is
        # the clone the action reads.
        #
        # fetch-depth is an input to the CHECKOUT, not to this action.
        # Passing it here is rejected with "Unexpected input(s)
        # 'fetch-depth', valid inputs are ['']" and the step fails, which
        # is what the first attempt did.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Bangla script hygiene (Appendix C scanner)
        # Catches wrong-script code points, broken normalisation and stray BOMs
        # in tracked text. Mechanical only; it never rewrites prose.
        #
        # The `|| true` that used to sit on the first line hid a dead scanner.
        # bn_scan.py always exits 0, so the only failure signal it has is the
        # summary it prints -- which means "the tool ran and found nothing" and
        # "the tool never ran" produced the same green step. A missing python3,
        # a crash, or an xargs failure left /tmp/bn.txt empty, grep matched
        # nothing, and the check passed. The exit status is left intact now, and
        # the empty-output assertion catches the case where the scanner runs but
        # writes nothing.
        run: |
          git ls-files -z | xargs -0 python3 scripts/bn_scan.py > /tmp/bn.txt
          test -s /tmp/bn.txt || { echo "::error::bn_scan.py produced no output -- the scanner did not run"; exit 1; }
          grep -E '^(ASSAMESE_LETTER|DEVANAGARI_NON_PUNCT|REPLACEMENT_CHAR|BOM_INSIDE_TEXT|NOT_NFC) +[1-9]' /tmp/bn.txt && {
            echo "::error::Bangla script hygiene check failed -- see the summary above"
            tail -40 /tmp/bn.txt
            exit 1
          }
          tail -14 /tmp/bn.txt

      - name: i18n parity and English-in-Bangla guard
        run: python3 scripts/check_i18n.py

      - name: Repository mojibake scan
        # Double-encoded UTF-8 (a Windows-1252 round trip) anywhere in tracked
        # text. Found 7 em dashes in docker-compose.yml on 2026-10-09.
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          TEXT = {'.py','.ts','.tsx','.js','.jsx','.json','.md','.txt','.html','.css',
                  '.yml','.yaml','.toml','.csv','.sql','.po','.ini','.cfg','.svg','.sh','.conf'}
          pat = re.compile('[\u00c2\u00c3][\u0080-\u00ff]|[\u00e2][\u0080-\u00bf]')
          files = [f for f in subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split()
                   if Path(f).suffix.lower() in TEXT]
          bad = []
          for f in files:
              try: t = Path(f).read_text(encoding='utf-8')
              except Exception: continue
              if pat.search(t): bad.append(f)
          if bad:
              print('mojibake (UTF-8 read as cp1252) in:', *bad, sep='\n  ')
              sys.exit(1)
          print(f'mojibake scan clean across {len(files)} text files')
          PY

  docker:
    name: Docker build & container smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t bangla-gpt-api:ci .

      - name: Trivy vulnerability gate (fail on FIXABLE high/critical)
        # NOTE: the previously pinned digest did not exist upstream
        # (manifest unknown), so this step could never pass. trivy 0.58.0
        # is verified working with these flags (0 fixable HIGH/CRITICAL).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 bangla-gpt-api:ci

      - name: Run container
        run: docker run -d --name api-smoke -p 8080:8000 -e ENV=ci bangla-gpt-api:ci

      - name: Wait for health endpoint
        run: |
          set -e
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs api-smoke
          exit 1

      - name: Readiness uses mock provider inside image
        run: curl -fsS http://127.0.0.1:8080/ready | grep -q '"provider":"mock"'

      - name: Cleanup
        if: always()
        run: |
          docker stop api-smoke || true
          docker rm api-smoke || true

  sbom-licence:
    name: SBOM artifacts & licence gate
    # AUD-B-16: release.yml sets sbom: true / provenance: mode=max but no
    # release has been cut, so no SBOM exists to inspect and licence checking
    # was prose in THIRD_PARTY_NOTICES.md. This job is PR-safe (no registry
    # push, no release) so a new dependency's licence fails the change that
    # introduces it, not the release that ships it; THIRD_PARTY_NOTICES.md
    # stays the human-readable inventory.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule is for dast-baseline only
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install the API (locked) and the SBOM/licence tooling
        # The runtime dependency set is installed from the hash-verified lock
        # into a dedicated venv; the tooling goes in afterwards, and the pins
        # are the versions this job was verified against locally
        # (cyclonedx-bom 7.5.0 produced a 1.6 spec with 111 components;
        # pip-licenses 5.5.5 passes the fail-on list below).
        run: |
          set -euo pipefail
          python -m venv .venv-sbom
          .venv-sbom/bin/python -m pip install --quiet --upgrade pip
          .venv-sbom/bin/python -m pip install --quiet --require-hashes -r apps/api/constraints.txt
          .venv-sbom/bin/python -m pip install --quiet "cyclonedx-bom==7.5.0" "pip-licenses==5.5.5"

      - name: CycloneDX SBOM (Python environment)
        run: .venv-sbom/bin/cyclonedx-py environment -o sbom-python.json

      - name: CycloneDX SBOM (web production tree)
        # Built from the committed lock file (--package-lock-only), so no
        # npm ci is needed and the SBOM describes exactly what the lock ships.
        # The positional argument is the package manifest, not a directory.
        run: >-
          npx --yes @cyclonedx/cyclonedx-npm@4.1.1
          --omit dev --package-lock-only
          --output-file sbom-web.json
          apps/web/package.json

      - name: Licence gate (fail on strong copyleft / SSPL)
        # LGPL-3.0 is allowed: the existing relink note in THIRD_PARTY_NOTICES.md
        # covers it. The first command writes the human-readable inventory;
        # the second re-reads the environment and fails on a listed licence.
        run: |
          set -euo pipefail
          .venv-sbom/bin/pip-licenses --format=csv --with-license-file \
            --ignore-packages bangla-gpt-api > licences-python.csv
          .venv-sbom/bin/pip-licenses --format=csv \
            --ignore-packages bangla-gpt-api \
            --fail-on "GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only;SSPL-1.0"

      - name: Upload SBOM and licence inventory
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-licences
          path: |
            sbom-python.json
            sbom-web.json
            licences-python.csv
          retention-days: 90

  dast-baseline:
    name: DAST baseline (ZAP, weekly)
    # AUD-B-15: nothing in .github/workflows ran DAST; the only scan was ad hoc
    # (ZAP against the test-mode container: FAIL-NEW 0 / WARN-NEW 1 / PASS 66).
    # Weekly + manual only: ZAP needs the API running, which is too slow for
    # every PR. The scan is unauthenticated by design -- the test-mode
    # docs/metrics surfaces exist there and production disables them
    # (AUD-B-18); authenticated surfaces stay covered by the authorization and
    # tenancy negative suites.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and start the API (test mode, mock provider)
        # ENV=test keeps the docs/metrics surfaces enabled (the production
        # set is production/prod/staging); the mock provider means no LLM key
        # and no outbound traffic. The JWT secret is a throwaway literal, not
        # a credential.
        run: |
          set -euo pipefail
          docker build -t bgpt-api:dast .
          docker run -d --name dast-api -p 127.0.0.1:8000:8000 \
            -e ENV=test -e LLM_PROVIDER=mock \
            -e DATABASE_URL=sqlite:////data/app.db \
            -e JWT_SECRET=ci-dast-secret-0123456789abcdef012345 \
            bgpt-api:dast
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::the API container did not become healthy"
            docker logs dast-api
            exit 1
          fi

      - name: ZAP baseline (fail on FAIL rules, warn-level reported)
        # The image is pinned to the digest of the "stable" tag resolved
        # 2026-10-19 via the ghcr registry API: a scheduled security job must
        # not run whatever build the tag points at that week. Re-resolve the
        # digest (and re-run this job) when the ZAP rule pack should move.
        env:
          DAST_OUT: ${{ runner.temp }}/dast-out
        run: |
          set -euo pipefail
          mkdir -p "$DAST_OUT"
          # -I: do not fail on WARN; FAIL rules still exit non-zero.
          docker run --rm --network host -v "$DAST_OUT:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t http://127.0.0.1:8000 \
            -J zap-baseline.json -r zap-baseline.html -I

      - name: Archive the report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-baseline
          path: ${{ runner.temp }}/dast-out/
          retention-days: 90

      - name: Stop the API container
        if: always()
        run: docker rm -f dast-api || true
