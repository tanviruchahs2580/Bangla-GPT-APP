name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Dependency audit (pip-audit)
        run: python -m pip_audit

      - name: Alembic migration check
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Smoke start (import app + open routes)
        run: python -c "from bangla_gpt_api.main import create_app; app = create_app(); print(sorted(r.path for r in app.routes))"

  web:
    name: Web build (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  docker:
    name: Docker build & container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bangla-gpt-api:ci .

      - name: Run container
        run: docker run -d --name api-smoke -p 8080:8000 -e ENV=ci bangla-gpt-api:ci

      - name: Wait for health endpoint
        run: |
          set -e
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs api-smoke
          exit 1

      - name: Readiness uses mock provider inside image
        run: curl -fsS http://127.0.0.1:8080/ready | grep -q '"provider":"mock"'

      - name: Cleanup
        if: always()
        run: |
          docker stop api-smoke || true
          docker rm api-smoke || true
