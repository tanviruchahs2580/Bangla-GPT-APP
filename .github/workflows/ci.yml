name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Size: pytest runs twice (plain + coverage) at ~8 min each on 3.12; the
    # two matrix legs run in parallel. 30 min leaves headroom, and a hung job
    # is otherwise billed for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # T-016: three tests in tests/test_cache_v2.py are skipped unless REDIS_URL
    # is set, and no job declared Redis, so cross-instance cache consistency,
    # the shared rate-limit window and cross-instance ranking-index hits -- the
    # reason Redis exists in this stack -- were never executed by any pipeline.
    # The service is declared here (both matrix legs) and REDIS_URL is set only
    # on the step that needs it, so the rest of the suite keeps running exactly
    # as it did before.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      # QE-08: the plain `pytest -q` step that used to sit here duplicated
      # the coverage run below test-for-test — one run with --cov carries
      # both the pass/fail signal and the branch coverage gate.
      - name: Shared-cache tests against a real Redis (T-016)
        # The three Redis-only tests in tests/test_cache_v2.py skip themselves
        # without REDIS_URL. They are run here, on the service declared on the
        # job, so the shared-cache/limiter/ranking-index behaviour is actually
        # exercised; REDIS_URL is deliberately scoped to this step because the
        # Tests/Coverage steps above must keep running exactly as before.
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        # F-163/TEST-05: every pytest leg runs under pytest-randomly with a
        # FIXED seed. Fixed, because a random seed per run would make a red
        # CI irreproducible (pytest-randomly prints the seed on failure, so a
        # local re-run reproduces the order); random, because the seed shuffles
        # both files and test functions, so an order dependence that only
        # surfaces on developer machines now surfaces here.
        run: pytest tests/test_cache_v2.py -q -p randomly --randomly-seed=20261030

      - name: Coverage gate (branch coverage, fail_under from pyproject)
        # Coverage used to be measured by nobody: fail_under was 0, no job
        # passed --cov, and pytest-cov was not a declared dev dependency.
        # The JSON report feeds the per-module floors step below; the XML
        # report stays the uploaded artifact.
        run: >-
          pytest -q
          -p randomly
          --randomly-seed=20261030
          --cov=bangla_gpt_api
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json
        working-directory: apps/api

      - name: Per-module coverage floors (critical paths)
        # F-058/TEST-02: the global fail_under says nothing about *where* the
        # coverage sits -- a well-covered schema module can hide a thin
        # authorization or privacy path. The floor table was measured on the
        # full suite (2026-10-30) and lives in the script; a module dropping
        # below its floor fails here, and the floors may only rise.
        run: python scripts/check_coverage_floors.py coverage.json
        working-directory: apps/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 14

      - name: Dependency audit (pip-audit, fail on vulnerable)
        # pip-audit exits non-zero when any vulnerability is found, so the
        # bare command already fails the gate (there is no --fail-on flag).
        #
        # setuptools is a build backend (build-system.requires), never a shipped
        # runtime dependency, but pip-audit scans the whole environment and so
        # picks up whatever setuptools the runner image happens to ship. The
        # Python 3.11 image carried 79.0.1, which PYSEC-2026-3447 flags
        # (fixed in 83.0.0); 83.0.0 is itself now flagged by GHSA-xmj3-9gf7-h52w
        # (fixed in 84.1.0), so the pin moves with the advisory. Upgrade to
        # exactly the fixed release before auditing so the gate reports
        # real, application-relevant vulnerabilities instead of runner drift
        # (GIT-08/F-186: an exact pin, so a future setuptools release cannot
        # change what this step audits).
        run: |
          python -m pip install --quiet --upgrade "setuptools==84.1.0"
          python -m pip_audit

      - name: Import-linter contracts (API layering)
        # ARCH-02/F-069: the layering (db is a leaf, retrieval below services,
        # providers not reaching into routers, ...) was convention-only. The
        # contracts live in .importlinter at the repository root; the tool is
        # installed here rather than added to the hash-locked dev extra, the
        # same way the sbom job installs cyclonedx-bom. Runs after pip-audit so
        # the audit scans the declared environment, not this tooling.
        run: |
          python -m pip install --quiet "import-linter==2.15"
          lint-imports

      - name: Alembic migration check
        # Dedicated throwaway DB (step isolation): a genuine up/down/up cycle
        # on one clean file. Must never share ./bangla_gpt.db (the app's dev
        # default store) — a collection-time import of main in the pytest step
        # above can otherwise leave a half-created schema behind.
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          rm -f /tmp/ci_migrations.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Smoke start (import app + open routes)
        # FastAPI >=0.118 keeps lazy _IncludedRouter entries in app.routes
        # (no .path attr); app.openapi() expands all registered routes.
        env:
          DATABASE_URL: sqlite:////tmp/ci_smoke.db
        run: python -c "from bangla_gpt_api.main import create_app; app = create_app(); print(len(app.openapi()['paths']), 'openapi paths ok')"

  quickstart-windows:
    name: Quick start (Windows PowerShell)
    # DOC-01: the README quick start is written for Windows PowerShell
    # (`.venv\Scripts\...`), and until this job existed no pipeline ran that
    # spelling -- the ubuntu `api` job covers the Linux form of the same two
    # install commands. This job runs the documented steps as written, boots
    # the documented server command (without --reload: a file watcher adds
    # nothing in CI) and probes /health, then installs and builds the web
    # dashboard the same way.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      # The README's web quick start runs under Node 24/npm 11 (engines in
      # apps/web/package.json). The windows runner image ships Node 22 and its
      # npm 10 refuses the npm-11 lockfile ("Missing: esbuild@0.28.2 from lock
      # file"), so this job sets the documented toolchain up itself, the same
      # way the web and e2e jobs do.
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: API quick start (README, PowerShell)
        # The README's exact commands. --require-hashes makes a broken pin
        # fail here exactly as it would on a contributor's machine.
        run: |
          cd apps/api
          python -m venv .venv
          .venv\Scripts\python -m pip install --require-hashes -r constraints.txt
          .venv\Scripts\python -m pip install --no-deps -e ".[dev]"

      - name: Boot the dev server and probe /health
        run: |
          cd apps/api
          $proc = Start-Process -FilePath ".venv\Scripts\python.exe" `
            -ArgumentList "-m", "uvicorn", "bangla_gpt_api.main:app", "--port", "8300" `
            -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8300/health" -TimeoutSec 2
                if ($health.status -eq "ok") { Write-Host "quick start /health ok"; exit 0 }
              } catch { Start-Sleep -Seconds 1 }
            }
            throw "documented server command never became healthy"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Web quick start (README, PowerShell)
        # npm ci + the documented type-checked build; the unit/E2E suites run
        # in the ubuntu web/e2e jobs, so this leg only proves the Windows path.
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  postgres:
    name: Postgres engine check (alembic + API flows)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgpt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Alembic migration cycle against Postgres
        # Pin to the Postgres service: without DATABASE_URL, alembic would
        # silently run the cycle against the file-SQLite default instead.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migration drift check (alembic check)
        # The upgrade/downgrade cycle above passes even when the models and the
        # migrations disagree: on 2026-10-09 `alembic check` failed with three
        # index differences, including token_hash and code_hash being unique in
        # the ORM but not in the database, and no job here ran that command.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: alembic check

      - name: Postgres-backed API journey tests
        run: pytest tests/test_postgres_smoke.py -v -p randomly --randomly-seed=20261030

      - name: Postgres-only single-use/race tests (T-017)
        # tests/test_single_use_tokens.py says "the `postgres` CI job sets it
        # ["TEST_DATABASE_URL"]" -- but this job only ran test_postgres_smoke.py,
        # so the two AUD-0034 race tests (exactly one winner for a verification
        # code / reset token under contention, measured 40/40 double-redeemable
        # on PostgreSQL before the fix) were asserted nowhere in CI despite the
        # service being right here. TEST_DATABASE_URL is already set job-wide
        # and the alembic steps above have created the schema in bgpt_ci.
        run: pytest tests/test_single_use_tokens.py -q -p randomly --randomly-seed=20261030

      - name: Full domain suite on Postgres (engine parity)
        # BGPT_TEST_DATABASE_URL switches every default-fixture test to this
        # database, with truncation isolation between tests (see
        # tests/conftest.py). Since H-02, tests resolve their database
        # through conftest.engine_url() instead of pinning
        # sqlite:///{tmp_path}/... directly, so the parity job now covers the
        # files that USED to hide on SQLite inside this job (84 of 140 files
        # at conversion time; the remainder pin multiple databases per test
        # or assert SQLite file posture and stay engine-explicit by design).
        # Engine-specific drift (JSON/boolean/UPSERT/transaction semantics,
        # FK enforcement) now fails CI instead of surfacing after a Postgres
        # cutover. Engine-explicit tests (smoke/race above) are deselected
        # here to avoid double-running.
        env:
          BGPT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          pytest -q \
            -p randomly --randomly-seed=20261030 \
            --deselect tests/test_postgres_smoke.py \
            --deselect tests/test_single_use_tokens.py
        # Measured locally: 1106 passed / 6 skipped on PostgreSQL. The step
        # budget covers the per-test schema-check + TRUNCATE overhead with
        # margin on a loaded runner.
        timeout-minutes: 45

  sbom:
    name: SBOM (CycloneDX, python + web)
    # QE-05: container images already ship an SBOM with provenance via the
    # release pipeline; the component-level manifests for the two shipped
    # source stacks were the procurement gap. Hash-verified constraints feed
    # the Python manifest, the package-lock feeds the web one; both are
    # attached as workflow artifacts on every push.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Generate Python SBOM (from the hash-verified lock)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          # GIT-08/F-186: exact pin, so an SBOM is generated by a known tool
          # release (the job's output is an artifact other systems consume).
          python -m pip install "cyclonedx-bom==7.6.0"
          python -m cyclonedx_py requirements constraints.txt --output-format JSON --output-file sbom-python.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies (SBOM scans the installed tree)
        working-directory: apps/web
        run: npm ci --no-audit --ignore-scripts

      - name: Generate web SBOM (syft, from the installed tree)
        # npm's own SBOM emitters (cyclonedx-npm and npm sbom) both run
        # Arborist validation first, and this lock intentionally overrides
        # esbuild for vite (ELSPROBLEMS is a red herring for an SBOM read).
        # Syft scans the installed directory without touching npm's
        # validator; pinned for supply-chain integrity like every action.
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          path: ./apps/web
          format: cyclonedx-json
          artifact-name: sbom-web.json

      # the web SBOM itself is attached by sbom-action (artifact
      # sbom-web.json); this upload carries the python manifest.
      - name: Upload python SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-python
          path: apps/api/sbom-python.json

  web:
    name: Web build & test (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      # S5.6: gate the shipped dependency set (the deployed image is static
      # nginx; vite/esbuild dev-server advisories are dev-machine-only and
      # triaged in docs/security/security_scans.md -- run a full `npm audit`
      # there too).
      - name: Dependency audit (npm audit, prod deps)
        run: npm audit --audit-level=high --omit=dev

      # H-03: thresholds are enforced in vite.config.ts (lines 68,
      # functions 60, branches 60, statements 70) — a run that drops below
      # them exits 1, so frontend coverage can no longer regress silently
      # while the backend enforces fail_under=80.
      - name: Unit tests with coverage gate (vitest)
        # F-163/TEST-05: shuffled files and tests with a FIXED seed, mirroring
        # the pytest legs. Vitest reports the seed, so a failure is
        # reproducible with the same command; --no-file-parallelism keeps the
        # memory profile of the run what it was.
        run: >-
          npm run test:coverage --
          --no-file-parallelism
          --sequence.shuffle
          --sequence.seed=20261030

      # FEQ-02: the web app had no linter at all. Type-aware ESLint with
      # --max-warnings 0, so a warning fails the build rather than scrolling by.
      - name: Lint (eslint, type-aware, zero warnings)
        run: npm run lint

      # F-005: CONTRIBUTING listed `npm run format:check` in the definition
      # of done while nothing in CI ran it, and it failed on six files — a
      # stated requirement that was both unenforced and unsatisfiable. The
      # files are formatted and the check is now part of the gate, so the
      # document and the build agree.
      - name: Format check (prettier)
        run: npm run format:check

      # F-096/FE-13: knip sat in devDependencies while nothing ran it, so
      # unused files, exports, types and unlisted dependencies could
      # accumulate with no gate. The step fails on any finding; knip.json
      # names the test/e2e/api entry points so test-only imports stay alive.
      - name: Dead code and unused exports (knip)
        run: npm run deadcode

      - name: Build (tsc + vite)
        run: npm run build

      # F-125/PERF-04: the budgets in lighthouserc.json are the desktop
      # baseline measured in wave 2 (LCP 4 s, CLS 0.1, TBT 3 s, score 0.5,
      # gzip budgets per resource type); before this step nothing gated the
      # built bundle on them. ubuntu-latest ships Chrome, which lhci drives.
      - name: Lighthouse budgets (desktop preset)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # T-040/T-041: the pre-commit hook set was never executed by any
      # workflow -- `.pre-commit-config.yaml` claimed the hook set is a subset
      # of CI, but nothing verified that the committed tree satisfies it, and
      # on a fresh clone it did not (37 files missing a final newline, 8 with
      # trailing whitespace, 1 CRLF, all inside the old scope). CI stayed
      # green while `pre-commit install` gave every developer a red first
      # commit.
      #
      # pre-commit REWRITES the files a fixer hook repairs and then exits 1
      # ("files were modified"), so this cannot pass on a tree that violates
      # the config it ships; `--show-diff-on-failure` prints the offending
      # diff. The tool version is pinned to the one the hook revs were
      # verified against, so a new pre-commit release cannot silently change
      # the gate.
      - name: Pre-commit hooks (all files)
        env:
          PRE_COMMIT_VERSION: "4.7.0"
        run: |
          set -euo pipefail
          python -m pip install --quiet "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure

      - name: Lockfile satisfies pyproject.toml
        # The previous version of this step could not fail. It ran
        #   pip-compile --output-file constraints.txt --quiet pyproject.toml
        # *in the checkout*, overwriting the committed lock, and then read that
        # regenerated file back to assert that each dependency named in
        # pyproject.toml appeared in it -- which is true of any file compiled
        # from pyproject.toml. CONTRIBUTING.md promised "a stale lock cannot
        # slip through"; none of that was enforced.
        #
        # It was not academic. Dependabot pinned redis==8.1.0 in the lock while
        # arq -- the reason redis is capped -- requires redis[hiredis]<6. This
        # job passed in 32 s and five other jobs then died with
        # `ResolutionImpossible`, which is how the whole dependency-update queue
        # stopped landing.
        #
        # check_lockfile.py asserts the two things that are true and decidable
        # offline: every declared dependency is pinned, and the pin satisfies
        # the declared specifier. It is read-only, so it cannot repeat the
        # mistake of grading a file it just rewrote. Regex differences between
        # it and a fresh `pip-compile` are not checked: that comparison is not
        # reproducible against a live index and it failed on valid locks.
        run: python3 apps/api/scripts/check_lockfile.py

      - name: Proxy-trust contract holds
        # TRUST_PROXY_HEADERS=true is only safe behind a proxy that OVERWRITES
        # X-Forwarded-For. The compose api service used to not forward the
        # flag at all, so behind the bundled Caddy every IP-scoped rate limit
        # silently shared one bucket (10 logins/min platform-wide). This keeps
        # the bundle self-consistent: the forwarding is present, and the Caddy
        # overwrite is present whenever trust ships true in compose or in
        # either env template.
        run: python3 apps/api/scripts/check_proxy_contract.py

      - name: Docs agree with the code
        # "Docs-as-tests" (DOC-02): the README's endpoint table and install
        # commands are assertions about the app. This re-derives the facts they
        # depend on, so a README that drifts from the code fails the build
        # instead of quietly misleading someone at 3am.
        run: python3 apps/api/scripts/check_readme_contract.py

      - name: Every repo path a document names exists
        # A guide that tells an operator to run `scripts/pg_backup.py` when the
        # file is `pg_backup.sh` costs real time during an incident. The
        # deployment guide added in this round made exactly that mistake on its
        # first draft and 7 more existed in living docs. Scope is deliberately
        # narrow -- repo-relative paths only -- because a broader heuristic was
        # tried first and produced 463 false hits, which is how a guard gets
        # deleted.
        run: python3 apps/api/scripts/check_doc_paths.py

      - name: Every bundled image is named in THIRD_PARTY_NOTICES.md
        # REPO-07/F-137: the checker existed but ran only in `make docs-check`,
        # so a new asset could land with no notices row. It fails when an image
        # under apps/web/src/assets/ or an apps/web/public/icon-* is not named
        # in the notices file (the provenance rows themselves stay an owner
        # action recorded there).
        run: python3 scripts/check_asset_notices.py

      - name: README and docs/ci.md agree with the workflows
        # F-008: the README's CI table invented a `golden-eval` job inside
        # ci.yml, omitted the sbom/guardrails jobs and never listed four of the
        # nine workflows -- while asserting it had been "read off the
        # workflow's own on: block". Derive those facts here instead: one row
        # per workflow file, every job id named in its row, and a trigger cell
        # that names exactly the event keys in the file's on: block.
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          WORKFLOWS = Path(".github/workflows")
          EVENT_KEYWORDS = (
              "branch_protection_rule",
              "pull_request",
              "push",
              "schedule",
              "workflow_dispatch",
              "workflow_run",
          )

          def on_keys(text: str) -> list[str]:
              lines = text.splitlines()
              start = lines.index("on:")
              keys = []
              for line in lines[start + 1 :]:
                  if line and not line[0].isspace():
                      break
                  match = re.match(r"^  ([a-z_]+):", line)
                  if match:
                      keys.append(match.group(1))
              return keys

          def job_keys(text: str) -> list[str]:
              lines = text.splitlines()
              start = lines.index("jobs:")
              keys = []
              for line in lines[start + 1 :]:
                  match = re.match(r"^  ([a-z][a-z0-9_-]*):\s*(?:#.*)?$", line)
                  if match:
                      keys.append(match.group(1))
              return keys

          problems: list[str] = []
          rows = {}
          for line in Path("README.md").read_text(encoding="utf-8").splitlines():
              match = re.match(r"^\| `([a-z0-9_.-]+\.yml)`", line)
              if match:
                  rows[match.group(1)] = line.lower()

          files = sorted(p.name for p in WORKFLOWS.glob("*.yml"))
          for name in sorted(set(files) - set(rows)):
              problems.append(f"README CI table has no row for workflow {name}")
          for name in sorted(set(rows) - set(files)):
              problems.append(f"README CI table names a workflow that does not exist: {name}")

          ci_doc = Path("docs/ci.md").read_text(encoding="utf-8")
          for name in files:
              text = (WORKFLOWS / name).read_text(encoding="utf-8")
              row = rows.get(name, "")
              for job in job_keys(text):
                  if not re.search(rf"\b{re.escape(job)}\b", row):
                      problems.append(f"README row for {name} does not name its job `{job}`")
              events = on_keys(text)
              for key in events:
                  if key not in row:
                      problems.append(f"README row for {name} does not name its trigger `{key}`")
              for keyword in EVENT_KEYWORDS:
                  if keyword in row and keyword not in events:
                      problems.append(
                          f"README row for {name} claims trigger `{keyword}` the workflow lacks"
                      )
          for job in job_keys((WORKFLOWS / "ci.yml").read_text(encoding="utf-8")):
              if f"`{job}`" not in ci_doc:
                  problems.append(f"docs/ci.md does not document ci.yml job `{job}`")

          for problem in problems:
              print("::error::" + problem)
          if problems:
              sys.exit(1)
          print(f"workflow tables agree: {len(files)} workflows, README and docs/ci.md in step")
          PY

      - name: CHANGELOG covers every commit
        # VCS-08: the changelog is generated from git history, so it cannot
        # claim anything that did not happen. This fails if a released or
        # unreleased commit is missing from it.
        run: python3 apps/api/scripts/check_changelog.py

      - name: Secret scan (gitleaks, full history)
        # F-019: gitleaks-action v2 scans the commits present in the local
        # clone, and the default fetch-depth of 1 means that is the pushed
        # delta only. The step was named "full history" and its comment
        # repeated a claim ("82 hits on main") that a full-history run does
        # not reproduce: it finds 2, both in files deleted before the
        # baseline and both judged non-credentials. The claim is now made
        # true -- see the fetch-depth: 0 on this job's checkout, which is
        # the clone the action reads.
        #
        # fetch-depth is an input to the CHECKOUT, not to this action.
        # Passing it here is rejected with "Unexpected input(s)
        # 'fetch-depth', valid inputs are ['']" and the step fails, which
        # is what the first attempt did.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Bangla script hygiene (Appendix C scanner)
        # Catches wrong-script code points, broken normalisation and stray BOMs
        # in tracked text. Mechanical only; it never rewrites prose.
        #
        # The `|| true` that used to sit on the first line hid a dead scanner.
        # bn_scan.py always exits 0, so the only failure signal it has is the
        # summary it prints -- which means "the tool ran and found nothing" and
        # "the tool never ran" produced the same green step. A missing python3,
        # a crash, or an xargs failure left /tmp/bn.txt empty, grep matched
        # nothing, and the check passed. The exit status is left intact now, and
        # the empty-output assertion catches the case where the scanner runs but
        # writes nothing.
        run: |
          git ls-files -z | xargs -0 python3 scripts/bn_scan.py > /tmp/bn.txt
          test -s /tmp/bn.txt || { echo "::error::bn_scan.py produced no output -- the scanner did not run"; exit 1; }
          grep -E '^(ASSAMESE_LETTER|DEVANAGARI_NON_PUNCT|REPLACEMENT_CHAR|BOM_INSIDE_TEXT|NOT_NFC) +[1-9]' /tmp/bn.txt && {
            echo "::error::Bangla script hygiene check failed -- see the summary above"
            tail -40 /tmp/bn.txt
            exit 1
          }
          tail -14 /tmp/bn.txt

      - name: i18n parity and English-in-Bangla guard
        run: python3 scripts/check_i18n.py

      - name: Native-review sheet is current
        # The sheet is what a native speaker reviews; a stale sheet means the
        # review covers strings that no longer exist and misses the ones that
        # do. Regenerate with `python scripts/gen_native_review.py` and commit.
        run: python3 scripts/gen_native_review.py --check

      - name: Repository mojibake scan
        # Double-encoded UTF-8 (a Windows-1252 round trip) anywhere in tracked
        # text. Found 7 em dashes in docker-compose.yml on 2026-10-09.
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          TEXT = {'.py','.ts','.tsx','.js','.jsx','.json','.md','.txt','.html','.css',
                  '.yml','.yaml','.toml','.csv','.sql','.po','.ini','.cfg','.svg','.sh','.conf'}
          pat = re.compile('[\u00c2\u00c3][\u0080-\u00ff]|[\u00e2][\u0080-\u00bf]')
          files = [f for f in subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split()
                   if Path(f).suffix.lower() in TEXT]
          bad = []
          for f in files:
              try: t = Path(f).read_text(encoding='utf-8')
              except Exception: continue
              if pat.search(t): bad.append(f)
          if bad:
              print('mojibake (UTF-8 read as cp1252) in:', *bad, sep='\n  ')
              sys.exit(1)
          print(f'mojibake scan clean across {len(files)} text files')
          PY

      # SEC-18: the SAST gate the audit could only mark INFERRED (semgrep was
      # not installed anywhere). Registry rulesets are pinned by the scanner
      # version; the scan scope and the triaged allowlist live in
      # .semgrepignore (every entry carries its reason there and in
      # docs/security/security_scans.md). ERROR-severity findings fail the
      # job; WARNING-level findings are triaged in the register instead, so a
      # rule that is not a defect cannot red the build. The 60 s per-rule
      # timeout beats semgrep's 30 s default, which timed out on the largest
      # workflow files (28 rule files skipped) under a loaded machine.
      - name: Semgrep (blocking, ERROR severity)
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
        run: |
          python -m pip install --quiet "semgrep==1.182.1"
          semgrep \
            --config p/python --config p/typescript --config p/react \
            --config p/docker --config p/github-actions --config p/secrets \
            --severity ERROR --error --timeout 60 --metrics=off .

      # Dockerfile lint, blocking. The one accepted rule (DL3008) and its
      # reason live in .hadolint.yaml: postgresql-client is deliberately
      # unpinned while openssl and libssl3t64 are pinned in the Dockerfile
      # with the refresh procedure documented there.
      - name: Hadolint (Dockerfiles)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint Dockerfile apps/web/Dockerfile

      # SEC-18 dependency gate for the shipped web bundle. The python side is
      # already covered by pip-audit in the api job and by the image scan in
      # the docker job; this closes the npm tree that the static image ships
      # with the same fixable-HIGH/CRITICAL threshold the image scan uses.
      # trivy suppresses dev dependencies by default, which matches what the
      # image contains and what `npm audit --omit=dev` gates one job over.
      - name: Trivy dependency scan (shipped npm bundle)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-dirs node_modules --skip-dirs dist \
            apps/web/package-lock.json

      # F-006/BE-05: complexity used to be measured by nobody. `ruff check`
      # (C901, mccabe max-complexity 20 in apps/api/pyproject.toml) refuses new
      # offenders, but ruff's count and radon's grade disagree on boolean-heavy
      # functions, so this is the independent radon view: no block at grade D
      # (complexity 21) or worse outside a recorded budget.
      #
      # The budget is a ratchet. A new D+ block, or a recorded block whose
      # score rose, fails the job. An entry that no longer offends only prints
      # a warning, so a cross-stream refactor that splits a listed function
      # cannot red another stream's change -- but the entry must be deleted in
      # the next commit, and the numbers may only ever fall. Adding an entry
      # requires the written reason in its comment.
      - name: Complexity ratchet (radon, grade D and worse)
        working-directory: apps/api
        run: |
          python -m pip install --quiet "radon==6.0.1"
          python - <<'PY'
          import json
          import subprocess
          import sys

          # path::function (Class.method for methods) -> measured radon score.
          BUDGET = {
              # Wave-2 split verify_corpus_manifest, build_data_export and
              # ask_stream: the first sections moved into named helpers
              # (nctb/manifest.py, gdpr.py _conversation_sections and
              # tutor.py _classify_streamed_answer), and the CI-repair pass
              # finished the job for the other two -- build_data_export ->
              # _user_activity_tables/_profile_content_tables (37 -> 10) and
              # ask_stream -> _retrieve_and_gate/_stream_events (26 -> 18) --
              # so all three now sit at grade C or better and their entries
              # are gone rather than raised. The blocks below stay recorded
              # at their measured scores until their own streams split them.
              "src/bangla_gpt_api/data/nctb_loader.py::load_nctb_corpus": 33,  # corpus build
              "src/bangla_gpt_api/evaluation/fairness_probes.py::validate_fixture": 32,  # eval tooling
              "src/bangla_gpt_api/evaluation/golden_v3.py::check_golden": 24,  # eval tooling
              "src/bangla_gpt_api/evaluation/metrics.py::run_suite": 36,  # eval tooling
              "src/bangla_gpt_api/services/tutor.py::TutorService._coverage_details": 34,  # tutor stream
          }
          raw = subprocess.run(
              [sys.executable, "-m", "radon", "cc", "src", "-s", "-j"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          findings = {}
          for path, blocks in json.loads(raw).items():
              for block in blocks:
                  if block["complexity"] > 20:
                      name = block["name"]
                      if block.get("classname"):
                          name = f"{block['classname']}.{name}"
                      findings[f"{path.replace(chr(92), '/')}::{name}"] = block["complexity"]
          regressions = []
          for key, score in sorted(findings.items()):
              limit = BUDGET.get(key)
              if limit is None:
                  regressions.append(f"new block above complexity 20: {key} ({score})")
              elif score > limit:
                  regressions.append(f"{key} rose from {limit} to {score}")
          for key in sorted(BUDGET):
              if key not in findings:
                  print(f"::warning::stale complexity budget entry ({key}); delete it")
          if regressions:
              for line in regressions:
                  print(f"::error::{line}")
              sys.exit(1)
          print(
              f"complexity ratchet holds: {len(findings)} block(s) above 20, "
              "all inside the recorded budget"
          )
          PY

      # F-073/BE-07: dead code used to be found by hand. vulture at 100 %
      # confidence is precise enough to gate on: the one entry below is the
      # only survivor, with its reason, and a new finding fails. Stale entries
      # warn instead of failing, so a cross-stream cleanup cannot red another
      # stream's change -- but the entry must then be deleted here. The
      # manifest.py 'check_files' entry was exactly that: the wave-2 close-out
      # deleted it once vulture stopped reporting the symbol.
      - name: Dead code (vulture, 100% confidence, allowlisted)
        working-directory: apps/api
        run: |
          python -m pip install --quiet "vulture==2.16"
          python - <<'PY'
          import subprocess
          import sys

          ALLOWED = {
              # The unreachable yield is what makes the stub an async
              # generator, which is the interface the tutor calls.
              "tests/test_scale_hardening.py:144: unreachable code after 'raise' (100% confidence)",
          }
          out = subprocess.run(
              [sys.executable, "-m", "vulture", "src", "tests", "--min-confidence", "100"],
              capture_output=True,
              text=True,
          ).stdout
          findings = [line.strip() for line in out.splitlines() if line.strip()]
          fresh = [line for line in findings if line not in ALLOWED]
          for line in fresh:
              print(f"::error::{line}")
          for line in sorted(ALLOWED):
              if line not in findings:
                  print(f"::warning::stale vulture allowlist entry ({line}); delete it")
          if fresh:
              sys.exit(1)
          print(f"vulture clean at 100% confidence ({len(findings)} allowlisted finding(s))")
          PY

  e2e:
    name: E2E (playwright, chromium)
    # C-01: the browser layer of the pyramid had vanished from main — the
    # suite existed only on an unmerged branch while stale .pyc files made it
    # look present. This job runs the restored specs against the REAL app
    # (dev server + seeded mock-provider API), so a broken route, auth guard
    # or proxy fails CI, not a user.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install web dependencies
        run: npm ci

      # E2E_PYTHON: the API's deps come from the hash-verified lock, the
      # interpreter from the runner — the playwright config seeds and serves
      # through this exact interpreter.
      - name: Install API package (hash-verified constraints)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      # The harness starts and seeds both servers itself (playwright.config
      # webServer blocks); CI gets fresh servers because reuseExistingServer
      # is disabled under CI. E2E_PYTHON points the seed at the runner env.
      - name: Run E2E suite (chromium)
        env:
          E2E_PYTHON: python
          CI: "true"
        run: npm run test:e2e

      - name: Production bundle: offline shell and throttled perf
        # B-06: the offline fallback is a marquee feature for rural 2G
        # students and its spec only registers the service worker on the
        # preview harness. A second playwright pass builds once and serves
        # `vite preview`; only the offline-shell spec is selected.
        #
        # w2-perf's Slow-3G interactivity budgets belong to the same pass:
        # they are claims about the shipped bundle, and the dev harness's
        # unbundled module graph cannot fit them under throttle regardless of
        # the product (the spec skips that test off the preview harness for
        # exactly that reason).
        env:
          E2E_PYTHON: python
          E2E_WEB: preview
          CI: "true"
        run: npx playwright test offline-shell w2-perf

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/.playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-engines:
    name: E2E (playwright, three engines)
    # F-025: playwright.engines.config.ts (letter-spacing, conjunct/tofu
    # clipping, font-weight and Intl assertions) was wired to no workflow, so
    # a regression that only breaks Gecko/WebKit Bangla shaping merged green
    # while the multi-engine claim went unchecked -- and the e2e job above
    # installs chromium only, so it cannot run this pass. Pull requests only:
    # the 40-minute chromium pass already gates every push, and this is the
    # slower double-install companion to it, not a nightly.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install web dependencies
        run: npm ci

      # Same interpreter contract as the chromium job: the engines config
      # inherits the base harness (seeded mock-provider API + dev server).
      - name: Install API package (hash-verified constraints)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Install the browsers this pass drives
        # All three: the config runs the spec in chromium, firefox and webkit,
        # and chromium's headless shell is not part of the sibling job's
        # chromium install in a fresh runner cache (measured: every test failed
        # with "Executable doesn't exist ... chrome-headless-shell-linux64").
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Run the three-engine pass (chromium, firefox, webkit)
        env:
          E2E_PYTHON: python
          CI: "true"
        run: npx playwright test -c playwright.engines.config.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-engines-report
          path: apps/web/.playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build & container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        # F-078: this job predated the buildx move and rebuilt every layer on
        # every push; the cache scope is separate from release.yml's so a PR
        # build cannot evict a release cache (or the other way round).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bangla-gpt-api:ci
          build-args: |
            APP_VERSION=ci
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,scope=ci-api,mode=max

      - name: Assert image provenance labels
        # F-153 guard: a label regression fails here instead of being found on
        # a host months later.
        run: |
          set -e
          source=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' bangla-gpt-api:ci)
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' bangla-gpt-api:ci)
          echo "source=$source revision=$revision"
          [ "$source" = "https://github.com/tanviruchahs2580/Bangla-GPT-APP" ] || { echo "::error title=Missing OCI source label::got $source"; exit 1; }
          [ "$revision" = "${{ github.sha }}" ] || { echo "::error title=Wrong OCI revision label::got $revision"; exit 1; }

      - name: Trivy vulnerability gate (fail on FIXABLE high/critical)
        # NOTE: the previously pinned digest did not exist upstream
        # (manifest unknown), so this step could never pass. trivy 0.58.0
        # is verified working with these flags (0 fixable HIGH/CRITICAL).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 bangla-gpt-api:ci

      - name: Run container
        # On a shared network so the k6 step can reach it by name: the k6
        # container's --network host could not dial the host-published port
        # on the runner (connection refused, measured 2026-10-24).
        run: |
          docker network create smoke
          docker run -d --name api-smoke --network smoke -p 8080:8000 -e ENV=ci bangla-gpt-api:ci

      - name: Wait for health endpoint
        run: |
          set -e
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs api-smoke
          exit 1

      - name: Liveness and readiness probes inside the image
        # F-078: /live was never exercised here, so a build that keeps the
        # static /health payload but breaks the request loop would pass.
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/live | grep -q '"status":"alive"'
          curl -fsS http://127.0.0.1:8080/ready | grep -q '"provider":"mock"'

      - name: Insecure production boot is refused (typo'd ENV)
        # The parked deploy contract (apps/api/eval/parked_specs/
        # test_deploy_contracts.py) pins that CI executes the image's most
        # valuable property: ENV=prodction is an unrecognized name, so the
        # boot guard must treat it as production and refuse to start with
        # the default secrets -- a typo'd ENV once booted production
        # unguarded (test_env_gate.py pins the code side). Measured against
        # the wave-2 image: exit 3, "Refusing to start" in the worker log.
        run: |
          set -e
          if docker run --rm -e ENV=prodction bangla-gpt-api:ci > /tmp/refusal.log 2>&1; then
            echo "::error title=Insecure boot accepted::ENV=prodction started the image"
            exit 1
          fi
          grep -q "Refusing to start" /tmp/refusal.log

      - name: Generate image SBOM (per-PR inventory of what shipped)
        # F-078: release.yml owns the attested image SBOMs; this one makes the
        # cheap per-PR job prove the image contents can be inventoried at all
        # (same pinned action as the sbom job).
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: bangla-gpt-api:ci
          format: cyclonedx-json
          output-file: sbom-api-image.cdx.json
          artifact-name: sbom-api-image.cdx.json

      - name: k6 load gate (smoke profile, thresholds enforced)
        # M-12: load/k6-tutor.js carried "Gates (CI/release)" thresholds that
        # no pipeline ever ran. This is a smoke-sized profile (2 VUs, 20s) —
        # the point is to catch error-rate/latency regressions per commit,
        # not capacity testing; scale via VUS/DURATION on a bigger runner
        # (documented in the script header). Digest = grafana/k6:0.58.0
        # amd64, resolved from the registry 2026-10-23; refresh with
        # scripts/update_image_digests.py discipline (verify before pinning).
        run: |
          # Share the api-smoke network NAMESPACE: Docker's embedded DNS
          # misresolved the container alias for the k6 image (measured
          # "server misbehaving", 2026-10-24); namespace sharing needs no DNS.
          docker run --rm --network container:api-smoke             -v "$PWD/load:/load:ro"             grafana/k6@sha256:15763404ccf3c7b93d8ff7f91a90566b589be81272c9423e94677380c3c88d4e             run -e BASE_URL=http://127.0.0.1:8000 -e VUS=2 -e DURATION=20s /load/k6-tutor.js

      - name: Cleanup
        if: always()
        run: |
          docker stop api-smoke || true
          docker rm api-smoke || true
