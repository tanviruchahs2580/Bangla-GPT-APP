name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Size: pytest runs twice (plain + coverage) at ~8 min each on 3.12; the
    # two matrix legs run in parallel. 30 min leaves headroom, and a hung job
    # is otherwise billed for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # T-016: three tests in tests/test_cache_v2.py are skipped unless REDIS_URL
    # is set, and no job declared Redis, so cross-instance cache consistency,
    # the shared rate-limit window and cross-instance ranking-index hits -- the
    # reason Redis exists in this stack -- were never executed by any pipeline.
    # The service is declared here (both matrix legs) and REDIS_URL is set only
    # on the step that needs it, so the rest of the suite keeps running exactly
    # as it did before.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Shared-cache tests against a real Redis (T-016)
        # The three Redis-only tests in tests/test_cache_v2.py skip themselves
        # without REDIS_URL. They are run here, on the service declared on the
        # job, so the shared-cache/limiter/ranking-index behaviour is actually
        # exercised; REDIS_URL is deliberately scoped to this step because the
        # Tests/Coverage steps above must keep running exactly as before.
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest tests/test_cache_v2.py -q

      - name: Coverage gate (branch coverage, fail_under from pyproject)
        # Coverage used to be measured by nobody: fail_under was 0, no job
        # passed --cov, and pytest-cov was not a declared dev dependency.
        run: >-
          pytest -q
          --cov=bangla_gpt_api
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
        working-directory: apps/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 14

      - name: Dependency audit (pip-audit, fail on vulnerable)
        # pip-audit exits non-zero when any vulnerability is found, so the
        # bare command already fails the gate (there is no --fail-on flag).
        #
        # setuptools is a build backend (build-system.requires), never a shipped
        # runtime dependency, but pip-audit scans the whole environment and so
        # picks up whatever setuptools the runner image happens to ship. The
        # Python 3.11 image carried 79.0.1, which PYSEC-2026-3447 flags
        # (fixed in 83.0.0), failing a leg over tooling we do not ship. Upgrade
        # to the fixed release before auditing so the gate reports real,
        # application-relevant vulnerabilities instead of runner drift.
        run: |
          python -m pip install --quiet --upgrade "setuptools>=83.0.0"
          python -m pip_audit

      - name: Alembic migration check
        # Dedicated throwaway DB (step isolation): a genuine up/down/up cycle
        # on one clean file. Must never share ./bangla_gpt.db (the app's dev
        # default store) — a collection-time import of main in the pytest step
        # above can otherwise leave a half-created schema behind.
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          rm -f /tmp/ci_migrations.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Smoke start (import app + open routes)
        # FastAPI >=0.118 keeps lazy _IncludedRouter entries in app.routes
        # (no .path attr); app.openapi() expands all registered routes.
        env:
          DATABASE_URL: sqlite:////tmp/ci_smoke.db
        run: python -c "from bangla_gpt_api.main import create_app; app = create_app(); print(len(app.openapi()['paths']), 'openapi paths ok')"

  postgres:
    name: Postgres engine check (alembic + API flows)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgpt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install locked, hash-verified dependencies first, then the project
          # itself with --no-deps (a local directory has no hash to check).
          # Regenerate constraints.txt with `pip-compile` when pyproject changes;
          # the "Lockfile satisfies pyproject.toml" step in the guardrails job
          # fails if a declared dependency is missing or its pin violates the
          # declared specifier.
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Alembic migration cycle against Postgres
        # Pin to the Postgres service: without DATABASE_URL, alembic would
        # silently run the cycle against the file-SQLite default instead.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migration drift check (alembic check)
        # The upgrade/downgrade cycle above passes even when the models and the
        # migrations disagree: on 2026-10-09 `alembic check` failed with three
        # index differences, including token_hash and code_hash being unique in
        # the ORM but not in the database, and no job here ran that command.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: alembic check

      - name: Postgres-backed API journey tests
        run: pytest tests/test_postgres_smoke.py -v

      - name: Postgres-only single-use/race tests (T-017)
        # tests/test_single_use_tokens.py says "the `postgres` CI job sets it
        # ["TEST_DATABASE_URL"]" -- but this job only ran test_postgres_smoke.py,
        # so the two AUD-0034 race tests (exactly one winner for a verification
        # code / reset token under contention, measured 40/40 double-redeemable
        # on PostgreSQL before the fix) were asserted nowhere in CI despite the
        # service being right here. TEST_DATABASE_URL is already set job-wide
        # and the alembic steps above have created the schema in bgpt_ci.
        run: pytest tests/test_single_use_tokens.py -q

      - name: Full domain suite on Postgres (engine parity)
        # BGPT_TEST_DATABASE_URL switches every default-fixture test to this
        # database, with truncation isolation between tests (see
        # tests/conftest.py). Since H-02, tests resolve their database
        # through conftest.engine_url() instead of pinning
        # sqlite:///{tmp_path}/... directly, so the parity job now covers the
        # files that USED to hide on SQLite inside this job (84 of 140 files
        # at conversion time; the remainder pin multiple databases per test
        # or assert SQLite file posture and stay engine-explicit by design).
        # Engine-specific drift (JSON/boolean/UPSERT/transaction semantics,
        # FK enforcement) now fails CI instead of surfacing after a Postgres
        # cutover. Engine-explicit tests (smoke/race above) are deselected
        # here to avoid double-running.
        env:
          BGPT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bgpt_ci
        run: |
          pytest -q \
            --deselect tests/test_postgres_smoke.py \
            --deselect tests/test_single_use_tokens.py
        # Measured locally: 1106 passed / 6 skipped on PostgreSQL. The step
        # budget covers the per-test schema-check + TRUNCATE overhead with
        # margin on a loaded runner.
        timeout-minutes: 45

  golden-eval:
    name: Golden retrieval benchmark (sample corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Run golden dataset evaluation (hit@3 / grounded accuracy gate)
        run: python scripts/evaluate_golden.py

      # The 634-item eval-v2 suite + recorded baseline (any metric dropping
      # >2pp fails) and the 16-item red-team gate ran previously only in the
      # separate eval-gate workflow (push/PR) and in local test assertions;
      # they now also gate every push to main here so a retrieval regression
      # cannot merge without them. --seed-bad is deliberately NOT used: the
      # baseline is a reviewed, committed artifact (R12).
      - name: Eval-v2 regression gate (634-item golden suite vs committed baseline)
        run: python -m bangla_gpt_api.evaluation.cli

      - name: Red-team gate (16 adversarial prompts, all refused, no leakage)
        run: python -m bangla_gpt_api.evaluation.cli --redteam

  web:
    name: Web build & test (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      # S5.6: gate the shipped dependency set (the deployed image is static
      # nginx; vite/esbuild dev-server advisories are dev-machine-only and
      # triaged in docs/security_scans.md -- run a full `npm audit` there too).
      - name: Dependency audit (npm audit, prod deps)
        run: npm audit --audit-level=high --omit=dev

      # H-03: thresholds are enforced in vite.config.ts (lines/functions/
      # statements 55, branches 75) — a run that drops below them exits 1,
      # so frontend coverage can no longer regress silently while the
      # backend enforces fail_under=80.
      - name: Unit tests with coverage gate (vitest)
        run: npm run test:coverage -- --no-file-parallelism

      # FEQ-02: the web app had no linter at all. Type-aware ESLint with
      # --max-warnings 0, so a warning fails the build rather than scrolling by.
      - name: Lint (eslint, type-aware, zero warnings)
        run: npm run lint

      # F-005: CONTRIBUTING listed `npm run format:check` in the definition
      # of done while nothing in CI ran it, and it failed on six files — a
      # stated requirement that was both unenforced and unsatisfiable. The
      # files are formatted and the check is now part of the gate, so the
      # document and the build agree.
      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (tsc + vite)
        run: npm run build

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # T-040/T-041: the pre-commit hook set was never executed by any
      # workflow -- `.pre-commit-config.yaml` claimed the hook set is a subset
      # of CI, but nothing verified that the committed tree satisfies it, and
      # on a fresh clone it did not (37 files missing a final newline, 8 with
      # trailing whitespace, 1 CRLF, all inside the old scope). CI stayed
      # green while `pre-commit install` gave every developer a red first
      # commit.
      #
      # pre-commit REWRITES the files a fixer hook repairs and then exits 1
      # ("files were modified"), so this cannot pass on a tree that violates
      # the config it ships; `--show-diff-on-failure` prints the offending
      # diff. The tool version is pinned to the one the hook revs were
      # verified against, so a new pre-commit release cannot silently change
      # the gate.
      - name: Pre-commit hooks (all files)
        env:
          PRE_COMMIT_VERSION: "4.7.0"
        run: |
          set -euo pipefail
          python -m pip install --quiet "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure

      - name: Lockfile satisfies pyproject.toml
        # The previous version of this step could not fail. It ran
        #   pip-compile --output-file constraints.txt --quiet pyproject.toml
        # *in the checkout*, overwriting the committed lock, and then read that
        # regenerated file back to assert that each dependency named in
        # pyproject.toml appeared in it -- which is true of any file compiled
        # from pyproject.toml. CONTRIBUTING.md promised "a stale lock cannot
        # slip through"; none of that was enforced.
        #
        # It was not academic. Dependabot pinned redis==8.1.0 in the lock while
        # arq -- the reason redis is capped -- requires redis[hiredis]<6. This
        # job passed in 32 s and five other jobs then died with
        # `ResolutionImpossible`, which is how the whole dependency-update queue
        # stopped landing.
        #
        # check_lockfile.py asserts the two things that are true and decidable
        # offline: every declared dependency is pinned, and the pin satisfies
        # the declared specifier. It is read-only, so it cannot repeat the
        # mistake of grading a file it just rewrote. Regex differences between
        # it and a fresh `pip-compile` are not checked: that comparison is not
        # reproducible against a live index and it failed on valid locks.
        run: python3 apps/api/scripts/check_lockfile.py

      - name: Proxy-trust contract holds
        # TRUST_PROXY_HEADERS=true is only safe behind a proxy that OVERWRITES
        # X-Forwarded-For. The compose api service used to not forward the
        # flag at all, so behind the bundled Caddy every IP-scoped rate limit
        # silently shared one bucket (10 logins/min platform-wide). This keeps
        # the bundle self-consistent: the forwarding is present, and the Caddy
        # overwrite is present whenever trust ships true in compose or in
        # either env template.
        run: python3 apps/api/scripts/check_proxy_contract.py

      - name: Docs agree with the code
        # "Docs-as-tests" (DOC-02): the README's endpoint table and install
        # commands are assertions about the app. This re-derives the facts they
        # depend on, so a README that drifts from the code fails the build
        # instead of quietly misleading someone at 3am.
        run: python3 apps/api/scripts/check_readme_contract.py

      - name: Every repo path a document names exists
        # A guide that tells an operator to run `scripts/pg_backup.py` when the
        # file is `pg_backup.sh` costs real time during an incident. The
        # deployment guide added in this round made exactly that mistake on its
        # first draft and 7 more existed in living docs. Scope is deliberately
        # narrow -- repo-relative paths only -- because a broader heuristic was
        # tried first and produced 463 false hits, which is how a guard gets
        # deleted.
        run: python3 apps/api/scripts/check_doc_paths.py

      - name: CHANGELOG covers every commit
        # VCS-08: the changelog is generated from git history, so it cannot
        # claim anything that did not happen. This fails if a released or
        # unreleased commit is missing from it.
        run: python3 apps/api/scripts/check_changelog.py

      - name: Secret scan (gitleaks, full history)
        # F-019: gitleaks-action v2 scans the commits present in the local
        # clone, and the default fetch-depth of 1 means that is the pushed
        # delta only. The step was named "full history" and its comment
        # repeated a claim ("82 hits on main") that a full-history run does
        # not reproduce: it finds 2, both in files deleted before the
        # baseline and both judged non-credentials. The claim is now made
        # true -- see the fetch-depth: 0 on this job's checkout, which is
        # the clone the action reads.
        #
        # fetch-depth is an input to the CHECKOUT, not to this action.
        # Passing it here is rejected with "Unexpected input(s)
        # 'fetch-depth', valid inputs are ['']" and the step fails, which
        # is what the first attempt did.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Bangla script hygiene (Appendix C scanner)
        # Catches wrong-script code points, broken normalisation and stray BOMs
        # in tracked text. Mechanical only; it never rewrites prose.
        #
        # The `|| true` that used to sit on the first line hid a dead scanner.
        # bn_scan.py always exits 0, so the only failure signal it has is the
        # summary it prints -- which means "the tool ran and found nothing" and
        # "the tool never ran" produced the same green step. A missing python3,
        # a crash, or an xargs failure left /tmp/bn.txt empty, grep matched
        # nothing, and the check passed. The exit status is left intact now, and
        # the empty-output assertion catches the case where the scanner runs but
        # writes nothing.
        run: |
          git ls-files -z | xargs -0 python3 scripts/bn_scan.py > /tmp/bn.txt
          test -s /tmp/bn.txt || { echo "::error::bn_scan.py produced no output -- the scanner did not run"; exit 1; }
          grep -E '^(ASSAMESE_LETTER|DEVANAGARI_NON_PUNCT|REPLACEMENT_CHAR|BOM_INSIDE_TEXT|NOT_NFC) +[1-9]' /tmp/bn.txt && {
            echo "::error::Bangla script hygiene check failed -- see the summary above"
            tail -40 /tmp/bn.txt
            exit 1
          }
          tail -14 /tmp/bn.txt

      - name: i18n parity and English-in-Bangla guard
        run: python3 scripts/check_i18n.py

      - name: Repository mojibake scan
        # Double-encoded UTF-8 (a Windows-1252 round trip) anywhere in tracked
        # text. Found 7 em dashes in docker-compose.yml on 2026-10-09.
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          TEXT = {'.py','.ts','.tsx','.js','.jsx','.json','.md','.txt','.html','.css',
                  '.yml','.yaml','.toml','.csv','.sql','.po','.ini','.cfg','.svg','.sh','.conf'}
          pat = re.compile('[\u00c2\u00c3][\u0080-\u00ff]|[\u00e2][\u0080-\u00bf]')
          files = [f for f in subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split()
                   if Path(f).suffix.lower() in TEXT]
          bad = []
          for f in files:
              try: t = Path(f).read_text(encoding='utf-8')
              except Exception: continue
              if pat.search(t): bad.append(f)
          if bad:
              print('mojibake (UTF-8 read as cp1252) in:', *bad, sep='\n  ')
              sys.exit(1)
          print(f'mojibake scan clean across {len(files)} text files')
          PY

  e2e:
    name: E2E (playwright, chromium)
    # C-01: the browser layer of the pyramid had vanished from main — the
    # suite existed only on an unmerged branch while stale .pyc files made it
    # look present. This job runs the restored specs against the REAL app
    # (dev server + seeded mock-provider API), so a broken route, auth guard
    # or proxy fails CI, not a user.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install web dependencies
        run: npm ci

      # E2E_PYTHON: the API's deps come from the hash-verified lock, the
      # interpreter from the runner — the playwright config seeds and serves
      # through this exact interpreter.
      - name: Install API package (hash-verified constraints)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e .

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      # The harness starts and seeds both servers itself (playwright.config
      # webServer blocks); CI gets fresh servers because reuseExistingServer
      # is disabled under CI. E2E_PYTHON points the seed at the runner env.
      - name: Run E2E suite (chromium)
        env:
          E2E_PYTHON: python
          CI: "true"
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/.playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build & container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t bangla-gpt-api:ci .

      - name: Trivy vulnerability gate (fail on FIXABLE high/critical)
        # NOTE: the previously pinned digest did not exist upstream
        # (manifest unknown), so this step could never pass. trivy 0.58.0
        # is verified working with these flags (0 fixable HIGH/CRITICAL).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 bangla-gpt-api:ci

      - name: Run container
        # On a shared network so the k6 step can reach it by name: the k6
        # container's --network host could not dial the host-published port
        # on the runner (connection refused, measured 2026-10-24).
        run: |
          docker network create smoke
          docker run -d --name api-smoke --network smoke -p 8080:8000 -e ENV=ci bangla-gpt-api:ci

      - name: Wait for health endpoint
        run: |
          set -e
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs api-smoke
          exit 1

      - name: Readiness uses mock provider inside image
        run: curl -fsS http://127.0.0.1:8080/ready | grep -q '"provider":"mock"'

      - name: k6 load gate (smoke profile, thresholds enforced)
        # M-12: load/k6-tutor.js carried "Gates (CI/release)" thresholds that
        # no pipeline ever ran. This is a smoke-sized profile (2 VUs, 20s) —
        # the point is to catch error-rate/latency regressions per commit,
        # not capacity testing; scale via VUS/DURATION on a bigger runner
        # (documented in the script header). Digest = grafana/k6:0.58.0
        # amd64, resolved from the registry 2026-10-23; refresh with
        # scripts/update_image_digests.py discipline (verify before pinning).
        run: |
          # Share the api-smoke network NAMESPACE: Docker's embedded DNS
          # misresolved the container alias for the k6 image (measured
          # "server misbehaving", 2026-10-24); namespace sharing needs no DNS.
          docker run --rm --network container:api-smoke             -v "$PWD/load:/load:ro"             grafana/k6@sha256:15763404ccf3c7b93d8ff7f91a90566b589be81272c9423e94677380c3c88d4e             run -e BASE_URL=http://127.0.0.1:8000 -e VUS=2 -e DURATION=20s /load/k6-tutor.js

      - name: Cleanup
        if: always()
        run: |
          docker stop api-smoke || true
          docker rm api-smoke || true
