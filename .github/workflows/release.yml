name: Release & Deploy

# B11 — continuous delivery:
#   tag push (vX.Y.Z) → build+push GHCR images → SSH deploy (optional).
# Rollback = redeploy the previous tag on the host (see docs/runbook.md).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Queue releases per ref instead of racing them. Two `v*` pushes in quick
# succession previously ran build-push and deploy concurrently against the same
# production host with no ordering guarantee. cancel-in-progress is false on
# purpose: a half-finished deploy must finish, not be replaced mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # T-026 -- the release pipeline had no dependency on CI at all.
  #
  # `push: tags: ["v*.*.*"]` started build-push (GHCR images + GitHub Release)
  # and, when `vars.DEPLOY_ENABLED == 'true'`, the SSH production deploy --
  # while ci.yml triggers on `push: branches: [main]` only, so the tag push ran
  # no tests and nothing tied the release to a green build. Tagging a commit
  # that CI never saw (or a mistaken tag on an old commit) shipped images and
  # could deploy production. deploy/DEPLOYMENT.md claimed "the deploy workflow
  # runs only after the full CI gate is green on main"; that claim was false.
  #
  # This job makes it true. Both jobs below `needs:` it, so it gates the image
  # push, the release record and the SSH deploy from one place. It runs on
  # every trigger (tag push and workflow_dispatch).
  ci-gate:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    # 10 minutes of bounded waiting below plus API/checkout overhead; a hung
    # job is otherwise billed for GitHub's 6-hour default.
    timeout-minutes: 15
    # `checks: read` is deliberately NOT requested. The Checks API cannot say
    # which workflow a check run belongs to -- a check run carries a name and a
    # suite id, and an Actions check suite exposes no workflow name -- so a
    # guard built on check-runs would have to hard-code the job names from
    # ci.yml and would break the release on any rename. The Actions runs API
    # answers the actual question ("did THIS repository's CI workflow conclude
    # success for this commit?") and needs only `actions: read`.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: CI must have concluded success for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bounded wait: a tag pushed immediately after a merge races the CI
          # run it is supposed to depend on. Waiting is preferred over failing
          # outright because a false "CI is still running" failure would push
          # operators to re-tag or bypass the gate; the wait is bounded so the
          # job cannot hang, and the message on expiry is actionable.
          CI_GATE_WAIT_SECONDS: "600"
          CI_GATE_POLL_SECONDS: "20"
        run: |
          set -euo pipefail

          # `github.sha` for an annotated-tag push is the TAG OBJECT, not the
          # commit it points at. HEAD is checked out at the commit under both
          # trigger types, so resolve through it and always query a commit.
          COMMIT_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_REF} points at commit ${COMMIT_SHA} (github.sha ${GITHUB_SHA} is the tag object)"
          fi

          WORKFLOW_FILE="ci.yml"
          deadline=$(( $(date +%s) + CI_GATE_WAIT_SECONDS ))
          runs=""
          pending=0
          main_success=0
          err="$(mktemp)"

          while :; do
            # An API/auth failure must not look like "no runs yet": capture the
            # error and fail immediately rather than polling for 10 minutes.
            if ! runs="$(gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${COMMIT_SHA}&per_page=100" \
                --jq '.workflow_runs[] | [.status, (.conclusion // "none"), .event, (.head_branch // "none"), .html_url] | @tsv' \
                2>"$err")"; then
              echo "::error title=CI gate cannot query GitHub::gh api failed for ${GITHUB_REPOSITORY} ${WORKFLOW_FILE} @ ${COMMIT_SHA}:"
              cat "$err"
              exit 1
            fi

            if [ -n "$runs" ]; then
              echo "CI (${WORKFLOW_FILE}) runs for ${COMMIT_SHA}:"
              printf '%s\n' "$runs" | awk -F'\t' '{printf "  status=%s conclusion=%s event=%s branch=%s %s\n", $1, $2, $3, $4, $5}'
            fi

            # A completed, successful run whose branch is main is the evidence
            # this gate exists to require (push:main is the normal case; a
            # manually dispatched CI run on main counts too).
            main_success=$(printf '%s\n' "$runs" | awk -F'\t' '$1=="completed" && $2=="success" && $4=="main" {n++} END {print n+0}')
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$1!="completed" {n++} END {print n+0}')

            if [ "$main_success" -gt 0 ]; then
              echo "CI (${WORKFLOW_FILE}) concluded success for ${COMMIT_SHA} on main; the release may proceed."
              exit 0
            fi

            # Wait (bounded) while a run for this commit is missing or still in
            # flight: a tag pushed right after a merge races its CI run.
            if { [ "$pending" -gt 0 ] || [ -z "$runs" ]; } && [ "$(date +%s)" -lt "$deadline" ]; then
              if [ -z "$runs" ]; then
                echo "No ${WORKFLOW_FILE} run has appeared for ${COMMIT_SHA} yet; waiting ${CI_GATE_POLL_SECONDS}s (bounded to ${CI_GATE_WAIT_SECONDS}s in total)..."
              else
                echo "CI has not finished for ${COMMIT_SHA}; waiting ${CI_GATE_POLL_SECONDS}s (bounded to ${CI_GATE_WAIT_SECONDS}s in total)..."
              fi
              sleep "$CI_GATE_POLL_SECONDS"
              continue
            fi
            break
          done

          # Every remaining path is a failure, with the reason spelled out.
          if [ -z "$runs" ]; then
            echo "::error title=No CI run for this commit::No run of ${WORKFLOW_FILE} exists for commit ${COMMIT_SHA} (ref ${GITHUB_REF}). A release tag must point at a commit this repository's CI workflow has tested. Push the commit to main, wait for 'API CI' to pass, then move the tag (git push --force origin ${GITHUB_REF} after git tag -f) or continue from a tested commit."
            exit 1
          fi
          if [ "$pending" -gt 0 ]; then
            echo "::error title=CI still running::${WORKFLOW_FILE} has not finished for ${COMMIT_SHA} within ${CI_GATE_WAIT_SECONDS}s. Wait for 'API CI' to complete, then re-run this workflow (gh workflow run release.yml --ref <ref>)."
            exit 1
          fi
          echo "::error title=CI not green::No run of ${WORKFLOW_FILE} for ${COMMIT_SHA} concluded success on main (the run list is printed above). Fix the build on main and re-tag: releasing an untested commit is exactly what this gate exists to prevent."
          exit 1

  build-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci-gate
    # packages:write is needed only to push to GHCR, so it is scoped to this
    # job rather than granted workflow-wide. The deploy job below runs SSH
    # commands on the host and has no reason to hold a registry token.
    # contents:write is for creating the GitHub Release; attestations/id-token
    # are for the build provenance and SBOM that buildx attaches (SCS-10).
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      api_image: ${{ steps.images.outputs.api }}
      web_image: ${{ steps.images.outputs.web }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute image names (GHCR requires lowercase)
        id: images
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (pinned)
        # F-08: images are pushed with an SBOM and buildx provenance; cosign
        # adds a keyless signature bound to this workflow's OIDC identity, so
        # a consumer can verify who built the tag. The action is SHA-pinned;
        # the cosign release it installs is pinned by version.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: "v2.5.3"

      - name: Compute version label
        id: meta
        run: echo "version=${GITHUB_REF_NAME:-manual-$(date +%s)}" >> "$GITHUB_OUTPUT"

      - name: Tag is SemVer vX.Y.Z and matches the declared version
        # F-08: the tag drove the image tag and the release record with no
        # check on its shape or on its agreement with the version the code
        # declares. `v1.2` or a tag pasted from another project produced a
        # release whose images say one version and whose code says another.
        # workflow_dispatch (no tag) skips this; a tag push cannot.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Tag is not SemVer::$RELEASE_TAG must match vMAJOR.MINOR.PATCH (no pre-release suffix, no leading zeros policy beyond the regex)."
            exit 1
          fi
          declared="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('apps/api/pyproject.toml').read_text())['project']['version'])")"
          if [ "v$declared" != "$RELEASE_TAG" ]; then
            echo "::error title=Tag does not match the code::tag ${RELEASE_TAG} != v${declared} (apps/api/pyproject.toml [project].version). scripts/check_version.py is the source of truth; align the tag with the version the release actually contains."
            exit 1
          fi
          echo "tag ${RELEASE_TAG} is SemVer and matches apps/api/pyproject.toml."

      # No `:latest` tag. The deploy job and docker-compose both address images
      # by the release tag (${API_TAG}/${WEB_TAG}), so a floating tag bought
      # nothing and cost reproducibility: two releases could silently overwrite
      # what "latest" points at, and a rollback would not move it. Version tags
      # are immutable, and the digest is recorded below and in the job summary.
      #
      # `sbom: true` attaches an SBOM to the image and `provenance: mode=max`
      # records how it was built; both need the attestations/id-token
      # permissions granted above.
      - name: Build & push API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          sbom: true
          provenance: mode=max

      - name: Build & push Web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          build-args: |
            VITE_API_BASE=/api
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          sbom: true
          provenance: mode=max

      # The pushed digest is the only stable identity of what shipped; record it
      # in the job summary so an operator running a host months later can map
      # the running image back to this release.
      - name: Attest the API image provenance
        # F-08: actions/attest-build-provenance writes a signed SLSA
        # provenance attestation for the pushed digest to the repository's
        # attestation store (verified with `gh attestation verify`).
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ steps.images.outputs.api }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ steps.images.outputs.web }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Sign the images keyless with cosign
        # Keyless: Fulcio issues a short-lived certificate for this workflow's
        # OIDC identity and the signature lands in the transparency log, so no
        # long-lived signing key exists to leak or rotate.
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${API_IMAGE}@${API_DIGEST}"
          cosign sign --yes "${WEB_IMAGE}@${WEB_DIGEST}"

      - name: Record image digests
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "### Published digests"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| $API_IMAGE | \`$API_DIGEST\` |"
            echo "| $WEB_IMAGE | \`$WEB_DIGEST\` |"
            echo
            echo "SBOM and buildx provenance are attached to both images, a signed"
            echo "SLSA provenance attestation is stored for each digest, and both"
            echo "images are cosign-signed keyless (Fulcio/Rekor)."
            echo
            echo "Verify with (one command per line; SC2028 keeps printf here"
            echo "because echo would not expand the backslash continuations):"
            echo "\`\`\`"
            printf 'gh attestation verify oci://%s@%s --repo %s\n' \
              "$API_IMAGE" "$API_DIGEST" "$GITHUB_REPOSITORY"
            printf "cosign verify %s@%s --certificate-identity-regexp '^https://github.com/%s/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\n" \
              "$API_IMAGE" "$API_DIGEST" "$GITHUB_REPOSITORY"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.version }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          # Re-running a tag build should be a no-op for the release record,
          # not an outage: never overwrite an existing release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it untouched."
            exit 0
          fi

          body="$(mktemp)"
          # Generated notes first; if the API cannot produce them (first release
          # has no previous tag), fall back to a minimal body rather than failing.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
               -f tag_name="$RELEASE_TAG" --jq .body > "$body" 2>/dev/null; then
            :
          else
            echo "See commit history for $RELEASE_TAG." > "$body"
          fi

          {
            echo
            echo "### Image digests"
            echo
            echo '```'
            echo "$API_IMAGE@$API_DIGEST"
            echo "$WEB_IMAGE@$WEB_DIGEST"
            echo '```'
            echo
            echo "Each image carries an SBOM and build provenance attestation."
          } >> "$body"

          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$body"

  deploy:
    name: Deploy to production host (SSH)
    # ci-gate is transitive through build-push, but it is listed explicitly so
    # the production-touching job cannot be reached by editing build-push's
    # dependency list alone.
    needs: [ci-gate, build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skips cleanly when deployment secrets are not configured yet.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      # Host-key verification is only real if the fingerprint is present.
      # drone-ssh skips verification when `fingerprint` is empty, so an unset
      # secret would silently turn the control off rather than fail loudly --
      # this step refuses to deploy in that case (CI-21).
      - name: Require a pinned deploy-host key
        env:
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST_FINGERPRINT:-}" ]; then
            echo "::error::DEPLOY_HOST_FINGERPRINT is not set. Without it the deploy"
            echo "::error::would skip SSH host-key verification. See docs/runbook.md"
            echo "::error::('Deploying a release') for how to obtain and store it."
            exit 1
          fi
          # A fingerprint is "SHA256:<base64>"; anything else means the secret
          # holds the wrong thing and verification would never match.
          case "$DEPLOY_HOST_FINGERPRINT" in
            SHA256:*) ;;
            *)
              echo "::error::DEPLOY_HOST_FINGERPRINT must look like SHA256:xxxx (got '${DEPLOY_HOST_FINGERPRINT}')"
              exit 1
              ;;
          esac
          echo "Deploy-host fingerprint present; host-key verification enabled."

      - name: Deploy release over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # Passed as an environment variable, never interpolated into the
          # script text: the tag comes from GITHUB_REF_NAME and expanding it
          # inside the remote script is a template-injection path.
          RELEASE_TAG: ${{ needs.build-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned host public key. drone-ssh compares the server's key against
          # this value and refuses the connection on mismatch or change.
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: RELEASE_TAG
          script: |
            set -e
            cd /opt/bangla-gpt
            git fetch --tags --force origin
            git checkout "$RELEASE_TAG"
            export API_TAG="$RELEASE_TAG"
            export WEB_TAG="$RELEASE_TAG"

            # Roll back to the previously deployed tag. Both failure paths below
            # use this, so the behaviour the runbook describes is the behaviour
            # that runs -- previously the rollback sat inside the `compose up`
            # branch only, so a release that started but failed its health gate
            # was reported as a failed job with the bad release still serving.
            rollback() {
              PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
              if [ -z "$PREV" ]; then
                echo "no previous tag to roll back to; leaving the stack as it is"
                return 1
              fi
              echo "rolling back to $PREV"
              git checkout "$PREV"
              export API_TAG="$PREV"; export WEB_TAG="$PREV"
              docker compose --profile core up -d --wait --wait-timeout 120
            }

            # Gate on the health the api container reports about itself, not on
            # a curl to a host port. The host mapping is opt-in (see
            # docker-compose.yml) and is not how production is served -- Caddy
            # and the tunnel reach the API as `api:8000` over the Compose
            # network. The old curl to 127.0.0.1:8000 therefore failed a
            # perfectly healthy release whenever API_HOST_PORT was left unset,
            # which the deployment docs tell operators to do.
            wait_healthy() {
              for _ in $(seq 1 30); do
                status=$(docker compose --profile core ps -q api \
                  | xargs -r docker inspect --format '{{.State.Health.Status}}' 2>/dev/null || true)
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            docker compose --profile core pull || true

            if ! docker compose --profile core up -d --wait --wait-timeout 120; then
              echo "DEPLOY FAILED — rolling back to previous running state"
              docker compose --profile core down || true
              rollback || true
              exit 1
            fi

            if ! wait_healthy; then
              echo "HEALTH GATE FAILED — rolling back to previous tag"
              rollback || true
              exit 1
            fi

            echo "Release $RELEASE_TAG healthy"
            exit 0
