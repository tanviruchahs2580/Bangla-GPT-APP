name: Release & Deploy

# B11 — continuous delivery:
#   tag push (vX.Y.Z) → build+push GHCR images → SSH deploy (optional).
# Rollback = redeploy the previous tag on the host (see docs/runbook.md).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Queue releases per ref instead of racing them. Two `v*` pushes in quick
# succession previously ran build-push and deploy concurrently against the same
# production host with no ordering guarantee. cancel-in-progress is false on
# purpose: a half-finished deploy must finish, not be replaced mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    # packages:write is needed only to push to GHCR, so it is scoped to this
    # job rather than granted workflow-wide. The deploy job below runs SSH
    # commands on the host and has no reason to hold a registry token.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      api_image: ${{ steps.images.outputs.api }}
      web_image: ${{ steps.images.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute image names (GHCR requires lowercase)
        id: images
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version label
        id: meta
        run: echo "version=${GITHUB_REF_NAME:-manual-$(date +%s)}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ steps.meta.outputs.version }}
            ${{ steps.images.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          build-args: |
            VITE_API_BASE=/api
          push: true
          tags: |
            ${{ steps.images.outputs.web }}:${{ steps.meta.outputs.version }}
            ${{ steps.images.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to production host (SSH)
    needs: build-push
    runs-on: ubuntu-latest
    # Skips cleanly when deployment secrets are not configured yet.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Deploy release over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/bangla-gpt
            git fetch --tags --force origin
            git checkout ${{ needs.build-push.outputs.tag }}
            export API_TAG=${{ needs.build-push.outputs.tag }}
            export WEB_TAG=${{ needs.build-push.outputs.tag }}

            docker compose --profile core pull || true

            if ! docker compose --profile core up -d --wait --wait-timeout 120; then
              echo "DEPLOY FAILED — rolling back to previous running state"
              docker compose --profile core down || true
              PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                git checkout "$PREV"
                export API_TAG="$PREV"; export WEB_TAG="$PREV"
                docker compose --profile core up -d --wait --wait-timeout 120
              fi
              exit 1
            fi

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
                echo "Release ${{ needs.build-push.outputs.tag }} healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check timeout after deploy"
            exit 1
