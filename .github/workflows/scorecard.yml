name: OpenSSF Scorecard

# AUD-EF-13 / F-16: nothing in the tree measured the repository's supply-chain
# posture. Scorecard scores branch protection, pinned dependencies, token
# permissions, dangerous workflows, SAST, fuzzing and more, and publishes the
# result as SARIF so the findings land in the Security tab with the CodeQL
# alerts. It needs no repository secrets: keyless OIDC proves the run's origin.

on:
  branch_protection_rule:
  schedule:
    - cron: "19 2 * * 6" # weekly, Saturday 02:19 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # SARIF upload into the Security tab.
      security-events: write
      # Keyless signing of the result bundle; proves the data came from here.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results makes the score retrievable from the public API
          # (api.securityscorecards.dev) and the badge below meaningful.
          publish_results: true

      - name: Upload the SARIF results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload the findings to the Security tab
        # NOTE on the codeql-action pin: it is a COMMIT sha, not the annotated
        # v3 tag object. Actions resolves either, but the tag object is
        # re-pointable and Scorecard's workflow verification rejects it as an
        # "imposter commit", which silently broke result publishing. Refresh the
        # pin with: gh api repos/github/codeql-action/git/tags/<v3 tag object>
        #   --jq .object.sha
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3 (commit, not the tag object — see below)
        with:
          sarif_file: results.sarif
