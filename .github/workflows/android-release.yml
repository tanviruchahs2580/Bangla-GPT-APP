name: Android release (Play Store AAB)

# Builds the Play Store artifact: a RELEASE-SIGNED Android App Bundle (.aab)
# plus a sideloadable release APK, both uploaded as workflow artifacts. It
# never publishes to Play by itself -- the upload is a human step in the Play
# Console (documented in docs/playstore/LAUNCH.md), which keeps the account,
# the listing and the rollout decision with the owner.
#
# Required repository secrets (owner-provided, see docs/playstore/LAUNCH.md):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload-key .jks  (base64 -w0 file.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Required repository variable (or the workflow_dispatch input):
#   VITE_API_BASE              absolute HTTPS API origin, e.g. https://api.<your-domain>/api
# Without the API base the Capacitor WebView cannot reach the backend (its
# origin is capacitor://localhost), so the job fails rather than shipping a
# shell that cannot log in.
#
# Runs on a released tag (v*) and on manual dispatch. The manual input
# version_code exists because Play requires versionCode to increase on every
# upload, and re-runs of the same tag would otherwise collide.
#
# It also runs on pull requests that touch the web app: the `debug-assemble`
# job syncs the CURRENT web bundle into the native project and assembles a
# debug APK, so "the Android shell builds from this codebase" is a gate rather
# than a hope. That gap was real -- the checked-in project had been synced in
# September while the web app moved on for seven weeks, and nothing noticed
# because nothing built it.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play versionCode (integer, must increase on every upload)"
        required: true
        type: string
      api_base:
        description: "Absolute API base URL (overrides the VITE_API_BASE repository variable)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/android-release.yml"

concurrency:
  # One Android build per ref: a superseded build is never the artifact a
  # release relies on, and two concurrent uploads of the same versionCode
  # would collide in Play anyway.
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed AAB + APK
    # PR runs are the debug-assemble gate below; a release needs the signing
    # secrets and must never be attempted from an unreleased ref.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Tag builds have no dispatch input; then the versionCode comes from the
      # repository variable, and the run number is the fallback that keeps two
      # rebuilds of one tag from colliding.
      VERSION_CODE: ${{ inputs.version_code || vars.ANDROID_VERSION_CODE || github.run_number }}
      API_BASE: ${{ inputs.api_base || vars.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require signing secrets and an absolute API base
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see docs/playstore/LAUNCH.md)"
            exit 1
          fi
          case "$API_BASE" in
            https://*) echo "API base: $API_BASE" ;;
            "") echo "::error::VITE_API_BASE is not set (repository variable or workflow input)"; exit 1 ;;
            *) echo "::error::VITE_API_BASE must be an absolute https URL, got: $API_BASE"; exit 1 ;;
          esac

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # JDK 17 is what AGP 8.7 requires; setup-java pins the distribution so
      # the runner image's default cannot shift the toolchain under a build
      # that will be uploaded to Play.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle for the native shell
        working-directory: apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Sync the bundle into the Android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Decode the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Written outside the workspace so it can never be picked up by a
          # later `git status`/artifact step; deleted in an always() step.
          install -d -m 700 "$RUNNER_TEMP/android-keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-keys/upload.jks"
          chmod 600 "$RUNNER_TEMP/android-keys/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-keys/upload.jks" >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionCode="$VERSION_CODE"

      - name: Verify the AAB is really signed
        run: |
          AAB="apps/web/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "::error::AAB not produced"; exit 1; }
          keytool -printcert -jarfile "$AAB" | sed -n '1,12p'
          echo "--- artifact ---"
          ls -l "$AAB" "apps/web/android/app/build/outputs/apk/release/app-release.apk"

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-keys"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: android-release-${{ env.VERSION_CODE }}
          path: |
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
            apps/web/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  debug-assemble:
    name: Android shell builds from this web bundle
    # The PR gate. No signing material is needed and none is used: a debug APK
    # is signed with the throwaway debug key. What this proves is that the
    # native project compiles against the CURRENT web build and that the bundle
    # `cap sync` copies is the bundle the build just produced -- the staleness
    # that goes unnoticed when the Android project is only visited at release
    # time. Release artifacts keep their own path (`bundle`, above); this job
    # never produces something a human should install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same source as the release job, minus the requirement: a PR has no
      # distribution audience, so a relative base is acceptable and keeps the
      # gate independent of owner-side repository variables.
      API_BASE: ${{ vars.VITE_API_BASE || '/api' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        working-directory: apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Sync the bundle into the Android project
        working-directory: apps/web
        run: npx cap sync android

      - name: The synced bundle is the bundle that was just built
        working-directory: apps/web
        run: |
          set -euo pipefail
          synced=android/app/src/main/assets/public
          fail=0
          # cap sync adds its own cordova stubs, so compare the build outputs
          # themselves: the entry document and every hashed chunk/asset under
          # assets/. A stale bundle is exactly a mismatch here.
          for f in index.html $(cd dist && find assets -type f | sort); do
            if [ ! -f "$synced/$f" ]; then
              echo "::error::missing in the Android project after cap sync: $f"; fail=1; continue
            fi
            a="$(sha256sum "dist/$f" | cut -d' ' -f1)"
            b="$(sha256sum "$synced/$f" | cut -d' ' -f1)"
            [ "$a" = "$b" ] || { echo "::error::stale synced asset: $f"; fail=1; }
          done
          [ "$fail" = "0" ] || {
            echo "The Android project does not carry the web build produced here."
            exit 1
          }
          echo "synced bundle matches dist ($(cd dist && find assets -type f | wc -l) assets + index.html)"

      - name: Assemble the debug APK
        working-directory: apps/web/android
        # The bit is now set in git, but a checkout that loses it (or an
        # archive export) fails with "Permission denied" at exit 126 — the
        # same shape of failure this job exists to surface, one layer down.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Report the artifact
        run: |
          APK=apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::debug APK not produced"; exit 1; }
          ls -l "$APK"
          {
            echo "### Android build gate"
            echo
            echo "- debug APK assembled: $(du -h "$APK" | cut -f1)"
            echo "- web bundle synced into the native project matches \`apps/web/dist\`"
            echo "- API base baked in: \`$API_BASE\` (a \`/\`-relative base is expected on PRs; the release job requires an absolute origin)"
            echo
            echo "This APK is a compile/sync proof, not a distributable build."
          } >> "$GITHUB_STEP_SUMMARY"
