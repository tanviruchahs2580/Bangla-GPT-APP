name: Eval gate (S4.7 golden-set regression)

# Spec 4.7: "CI gate fails build on >2% regression". Runs the golden v2
# suite (eval/golden_v2.json, 634 items) against the hermetic mock provider
# and compares every metric against eval/baseline_v2.json; any metric that
# drops by more than 2 percentage points fails this job.
#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # F-05: superseded PR runs are cancelled (the audit found the eval gate
  # queueing full runs against an already-replaced commit). cancel-in-progress
  # is safe here: the gate is read-only and a cancelled run is never the
  # evidence a merge relies on, the successor rerun is.
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-gate:
    name: Golden-set regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      # Hash-verified install, same as the api CI job: the eval gate decides
      # what code may merge, so it must not resolve unpinned transitive
      # versions that neither production nor the api job ever see.
      - name: Install package (hash-verified constraints)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      # --write-baseline is deliberately NOT used here: the baseline is a
      # reviewed, committed artifact (R12: never re-baseline to go green).
      - name: Run eval v2 suite vs recorded baseline (exit 1 on >2pp drop)
        run: python -m bangla_gpt_api.evaluation.cli
