name: Eval gate (S4.7 golden-set regression)

# Spec 4.7: "CI gate fails build on >2% regression". Runs the golden v2
# suite (eval/golden_v2.json, 634 items) against the hermetic mock provider
# and compares every metric against eval/baseline_v2.json; any metric that
# drops by more than 2 percentage points fails this job.
#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # F-05: superseded PR runs are cancelled (the audit found the eval gate
  # queueing full runs against an already-replaced commit). cancel-in-progress
  # is safe here: the gate is read-only and a cancelled run is never the
  # evidence a merge relies on, the successor rerun is.
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-gate:
    name: Golden-set regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      # Hash-verified install, same as the api CI job: the eval gate decides
      # what code may merge, so it must not resolve unpinned transitive
      # versions that neither production nor the api job ever see.
      - name: Install package (hash-verified constraints)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      # --write-baseline is deliberately NOT used here: the baseline is a
      # reviewed, committed artifact (R12: never re-baseline to go green).
      - name: Run eval v2 suite vs recorded baseline (exit 1 on >2pp drop)
        run: python -m bangla_gpt_api.evaluation.cli

  replay-gate:
    name: Live-response replay gate (A8-05)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      - name: Install package (hash-verified constraints)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      # A8-05: the PR-cheap half of the live evaluation. The scheduled job
      # (nightly.yml: live-eval) runs the real provider and records every
      # response; this job replays the newest committed recording through the
      # same pipeline with no key and no network, so a code change that moves
      # a generation metric fails the PR. A prompt change that invalidates the
      # recording fails loudly too (ReplayMissError) instead of silently
      # grading a fresh prompt against old answers.
      - name: Replay the newest committed live recording vs its baseline
        run: |
          set -euo pipefail
          # SC2012: `find` (not `ls`) so a directory name with odd characters cannot break the parse; the date-named dirs sort lexically.
          dir="$(find eval/live -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -r | head -1 || true)"
          dir="${dir:+$dir/}"
          if [ -z "$dir" ] || [ ! -f "${dir}recorded_responses.jsonl" ]; then
            echo "::error title=No recording::no committed live recording found under apps/api/eval/live/; a gate with no input is vacuous"
            exit 1
          fi
          echo "replaying $dir"
          python scripts/evaluate_replay.py \
            --recording "${dir}recorded_responses.jsonl" \
            --baseline "${dir}live_generation_report.json"
