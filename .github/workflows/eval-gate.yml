name: Eval gate (S4.7 golden-set regression)

# Spec 4.7: "CI gate fails build on >2% regression". Runs the golden v3
# suite (eval/golden_v3.json, 427 items — the CLI default since the v3
# hardened baseline; eval/golden_v2.json has 634 items and is the superseded
# generation) against the hermetic mock provider and compares every metric
# against eval/baseline_v3.json (evaluation/cli.py sets both defaults at
# `golden_path` / `baseline_path`); any metric that drops by more than 2
# percentage points fails this job.
#
# Two more gates run here, both blocking (F-050/F-059): the 24-question
# golden retrieval set (apps/api/scripts/evaluate_golden.py; it reports
# hit@3 and exits 1 when its accuracy threshold fails) and the red-team
# moderation suite (evaluation.cli --redteam; every adversarial turn must be
# refused and no response may leak control-plane text). Both were documented
# as CI steps and ran in no workflow, so a hit@3 or safety regression merged
# silently.
#
# CI-FIX-003: this workflow is ALSO called as a reusable workflow from the
# `eval` job in ci.yml, and ci.yml's required `Web build & test` job has
# `needs: eval`. GitHub cannot express `needs:` across workflow files, so a
# call is the only structural way to put the eval gates on the critical path
# of a context branch protection already requires: if the golden-set gate
# drops >2pp, `web` never starts and the PR cannot merge green. The
# standalone push/pull_request triggers are kept deliberately -- the
# `Golden-set regression gate` check name (the one an owner would add to the
# required contexts, docs/ci.md) must keep appearing on PRs unchanged.
#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_model:
        description: "Also run the gate against the REAL provider (needs GEMINI_API_KEY secret; non-blocking report)"
        type: boolean
        required: false
        default: false
  workflow_call:
    # Declared so a caller may pass it; the real-model probe below is
    # dispatch-only, so a plain call leaves it empty and the step is skipped.
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  eval-gate:
    name: Golden-set regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt

      # Hash-verified install, same as the api CI job: the eval gate decides
      # what code may merge, so it must not resolve unpinned transitive
      # versions that neither production nor the api job ever see.
      - name: Install package (hash-verified constraints)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints.txt
          python -m pip install --no-deps -e ".[dev]"

      # --write-baseline is deliberately NOT used here: the baseline is a
      # reviewed, committed artifact (R12: never re-baseline to go green).
      # Runs BEFORE the comparison: if the committed baseline no longer
      # describes this code, comparing against it is meaningless. Also makes
      # legible that this suite measures the bundled sample corpus, not the
      # NCTB corpus the product serves.
      - name: Baseline identity matches this code (no silent drift)
        run: python scripts/check_eval_binding.py

      - name: Run eval v3 suite vs recorded baseline (exit 1 on >2pp drop)
        run: python -m bangla_gpt_api.evaluation.cli

      # F-050: the 24-question golden set was documented as a CI gate and ran
      # nowhere. Second-level: it is the harness that prints hit@3 and gates
      # grounded accuracy (its thresholds live in the script, not here).
      # Measured on this tree: 24 items, hit@3 1.0, grounded 1.0, ~4s.
      - name: Golden retrieval gate (24-question set, blocking)
        run: python scripts/evaluate_golden.py

      # F-059: the red-team benchmark ("all adversarial questions refused, no
      # system-prompt leak") existed as a CLI mode and no workflow called it.
      # Mock provider, hermetic, exits 1 on any unrefused turn or leak.
      # Measured on this tree: 23 items, PASS, ~3s.
      - name: Red-team moderation gate (blocking)
        run: python -m bangla_gpt_api.evaluation.cli --redteam

      # M-19: the committed gate is hermetic against the mock provider, so it
      # catches retrieval/pipeline regressions but never REAL model output
      # quality. This optional leg runs the same suite against the configured
      # provider when manually dispatched with real_model=true; it produces a
      # report artifact for human review and is deliberately informational
      # (continue-on-error) — provider variance must not break merges.
      - name: Real-model quality probe (manual dispatch, informational)
        if: github.event_name == 'workflow_dispatch' && inputs.real_model
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bangla_gpt_api.evaluation.cli --real-model 2>&1 | tee real-model-report.txt
        continue-on-error: true

      - name: Upload real-model report
        if: github.event_name == 'workflow_dispatch' && inputs.real_model
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-model-eval-report
          path: apps/api/real-model-report.txt
          if-no-files-found: ignore
