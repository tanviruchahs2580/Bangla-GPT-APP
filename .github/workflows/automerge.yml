# Arm native GitHub auto-merge on every non-draft PR aimed at main.
#
# The merge itself stays with GitHub's native auto-merge machinery: branch
# protection requires the eight status checks, so the PR merges the moment
# they pass and nothing merges while a required check is red. Fork PRs
# (head.repo.full_name != github.repository) are deliberately left out --
# a token from a fork-triggered event must never be able to steer main.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}

jobs:
  arm:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (waits for the required checks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}" \
            --repo "${{ github.repository }}"
