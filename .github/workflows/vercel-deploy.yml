name: Vercel Production Deploy

# SOP: production deploys run only after the full CI gate ("API CI") is
# green on main. The Vercel Git integration may still build every push;
# this workflow is the explicit CI-gated path with a post-deploy smoke
# check against the production alias. Rollback: Vercel dashboard >
# Deployments > previous READY deployment > "Promote to Production"
# (instant, no rebuild), or `vercel rollback` with a scoped token.

on:
  workflow_run:
    workflows: ["API CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web to Vercel (production)
    # workflow_run executes with this repository's secrets, so the trigger is
    # only trusted when the completed run is unambiguously a successful push
    # to main in THIS repository. Without these four checks the workflow could
    # be induced to check out and deploy an arbitrary commit while holding the
    # production Vercel token; the branch filter alone does not prove the run
    # came from the base repository. Manual dispatch always allowed.
    #
    # F-09: the environment is what lets the OWNER attach required reviewers
    # and move the VERCEL_* secrets out of repository scope (docs/ci.md §5,
    # exact payloads). Until those settings are applied the environment exists
    # with no protection rules, so this line changes nothing by itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: vercel-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies and Chromium
        # AUD-G-15: the web build ends in `scripts/prerender.mjs`, which writes
        # the seven public routes' documents and inlines their first-paint
        # stylesheet. It drives the built app in Chromium; a build host without
        # it degrades to the SPA shell (measured: the 2026-10-21 deploy of the
        # prerendered output was done by hand for exactly that reason). The
        # browser comes from the repository's own pinned @playwright/test, so
        # the deploy builds the same artifact CI tests.
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Link Vercel project (from encrypted secrets, never committed)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"bangla-gpt-app"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: "Preflight: deployment credentials"
        # Vercel rejects a revoked or expired token with one line of CLI output
        # ("The token provided via `--token` argument is not valid") that arrives
        # after the whole CLI has downloaded and run. On 2026-10-11 that left
        # production web deploys broken for five days with nothing in the log
        # naming the cause. `vercel whoami` is a single authenticated request, so
        # it distinguishes "the secret is absent" from "Vercel rejected it" in
        # seconds and before any deploy work happens.
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error title=Missing secret::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set. Repository secrets cannot be read from a fork."
            exit 1
          fi
          if ! npx --yes vercel@63.1.0 whoami --token="$VERCEL_TOKEN" 2>&1; then
            echo "::error title=Rejected credential::Vercel refused VERCEL_TOKEN. It was revoked or expired on the Vercel side; re-saving the same value in GitHub will not fix it. Mint a new token and follow docs/runbook.md 'Vercel deployment token'."
            exit 1
          fi

      - name: Build for production (prebuilt output)
        # Version-pinned: the previous `npx vercel` resolved whatever was
        # latest at run time and executed it with a production token. The build
        # runs HERE, on a runner that has Chromium, and the deploy ships its
        # output (`--prebuilt`) instead of asking Vercel's build image to
        # reproduce it -- that image has no Playwright browser, so a remote
        # build silently drops the prerender.
        run: npx --yes vercel@63.1.0 build --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy (production, prebuilt)
        run: npx --yes vercel@63.1.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Post-deploy smoke check (production alias, /api/health)
        # F-048: this used to GET /login. That is a static SPA route served by
        # Vercel's CDN with no origin behind it, so it answered 200 through
        # the entire outage this repository is currently in -- every API call
        # failing and the deploy reported itself healthy. The check has to
        # touch the thing that actually broke: the /api/* proxy to
        # API_ORIGIN.
        #
        # T-028: the version of this step that accepted `200 || 502` had the
        # same defect one step along. handleApiProxy answers 502 with
        # `api_origin_unreachable` exactly when the origin could not be
        # reached, so treating 502 as "proxy is live" made the one production
        # check that touches the API report success for a dead origin -- the
        # F-048 failure mode, re-opened. The only proof that the deploy is
        # serving is a real 200 carrying the API's own health body; every
        # other status is retried with a bounded backoff (~4 min) and then
        # fails the workflow, including 502.
        run: |
          set -e
          url=https://bangla-gpt-app.vercel.app/api/health
          delays=(5 10 15 20 30 30 30 30 30 30)
          max_attempts=$(( ${#delays[@]} + 1 ))
          attempt=0
          code=000
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            code=$(curl -s -o /tmp/smoke.txt -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              echo "production alias $url -> 200 (API health served through the /api proxy)"
              head -c 300 /tmp/smoke.txt; echo
              exit 0
            fi
            echo "attempt ${attempt}/${max_attempts}: $url -> ${code} (not healthy)"
            head -c 300 /tmp/smoke.txt 2>/dev/null || true; echo
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "${delays[$((attempt - 1))]}"
            fi
          done
          echo "::error title=Post-deploy smoke failed::$url never returned 200 after ${max_attempts} attempts (~4 min). Last status: ${code}. A 502 here means the /api proxy could not reach API_ORIGIN (the API origin is down or unreachable); any other status means the alias is not serving the deployed app. The deployment is NOT healthy -- see docs/runbook.md."
          exit 1

      - name: Post-deploy smoke check (production alias serves the prerendered build)
        # AUD-G-15: a 200 on /login is not enough -- the SPA shell answers 200
        # too, and that is exactly what ships when the prerender step did not
        # run (Vercel's own build image, before this workflow prebuilt on the
        # runner). The prerendered `/login` document carries its markup and the
        # inlined first-paint stylesheet, so it is an order of magnitude bigger
        # than the shell; both facts are asserted, not assumed.
        run: |
          set -e
          shell_size=$(curl -s -o /dev/null -w "%{size_download}" https://bangla-gpt-app.vercel.app/ || true)
          ok=0
          for _ in $(seq 1 12); do
            body=$(curl -s https://bangla-gpt-app.vercel.app/login || true)
            code=$(curl -s -o /dev/null -w "%{http_code}" https://bangla-gpt-app.vercel.app/login || true)
            size=${#body}
            if [ "$code" = "200" ] && [ "$size" -gt 20000 ] && printf '%s' "$body" | grep -q 'data-inlined-stylesheet'; then
              echo "production alias /login -> 200, ${size} bytes, first-paint stylesheet inlined (shell is ${shell_size} bytes)"
              ok=1
              break
            fi
            echo "waiting for the prerendered alias (status ${code}, ${size} bytes)"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error title=Prerender missing::/login is not serving the prerendered document (a shell-sized response means scripts/prerender.mjs did not run in this build); check the 'Install web dependencies and Chromium' step."; exit 1; }
