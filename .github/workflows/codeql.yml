name: CodeQL SAST

# Static application security testing over both codebases: the FastAPI
# service (python) and the React dashboard (javascript-typescript). The
# default rule set plus the Security Extended suite runs on every push to
# main and PR, and weekly so CVE rule updates reach the branch even when
# nothing was pushed. Findings land in GitHub's Security tab via SARIF.
#
# Complements (does not duplicate) the existing gates: pip-audit / npm audit
# are dependency-level, gitleaks is secret-level, Trivy is image-level --
# this is the code-level detector the pipeline was missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  # CI-FIX-014 (2026-11-18): release.yml's ci-gate requires a completed,
  # successful codeql.yml run with head_branch=main for the exact commit being
  # released. That run is normally produced by the `push: main` trigger -- but
  # a push made with GITHUB_TOKEN does not start workflows (GitHub's
  # anti-recursion rule), and every merge in this repo is a bot auto-merge
  # authored by GitHub <noreply@github.com>. Measured: commits c5ac13e and
  # d14daef have no codeql.yml run at all, while the same code was scanned on
  # its PR head (run 44313230870 on 6288b3f) -- so the release gate could never
  # be satisfied for a bot-merged main commit.
  #
  # ci.yml and eval-gate.yml already declare workflow_dispatch and the gate's
  # `head_branch == main` test accepts a dispatched run on main, which is the
  # documented remedy ("a manually dispatched CI run on main counts too").
  # This makes codeql.yml symmetrical instead of special.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required for the CodeQL analyze action to upload SARIF results
      security-events: write
      contents: read
      # CodeQL needs pull-requests: read to attribute alerts to changed PR files
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # NOTE on the codeql-action pin: it is a COMMIT sha, not the annotated
        # v3 tag object. Actions resolves either, but the tag object is
        # re-pointable and Scorecard's workflow verification rejects it as an
        # "imposter commit", which silently broke result publishing. Refresh the
        # pin with: gh api repos/github/codeql-action/git/tags/<v3 tag object>
        #   --jq .object.sha
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3 (commit, not the tag object — see below)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Scan the one real codebase per language: apps/web/nbproject and
          # apps/web/android framework stubs are generated/IDE metadata.
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3 (commit, not the tag object — see below)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3 (commit, not the tag object — see below)
        with:
          category: "/language:${{ matrix.language }}"
