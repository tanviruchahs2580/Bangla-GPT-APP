name: CodeQL SAST

# Static application security testing over both codebases: the FastAPI
# service (python) and the React dashboard (javascript-typescript). The
# default rule set plus the Security Extended suite runs on every push to
# main and PR, and weekly so CVE rule updates reach the branch even when
# nothing was pushed. Findings land in GitHub's Security tab via SARIF.
#
# Complements (does not duplicate) the existing gates: pip-audit / npm audit
# are dependency-level, gitleaks is secret-level, Trivy is image-level --
# this is the code-level detector the pipeline was missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required for the CodeQL analyze action to upload SARIF results
      security-events: write
      contents: read
      # CodeQL needs pull-requests: read to attribute alerts to changed PR files
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # NOTE on the codeql-action pin: it is a COMMIT sha, not the annotated
        # v3 tag object. Actions resolves either, but the tag object is
        # re-pointable and Scorecard's workflow verification rejects it as an
        # "imposter commit", which silently broke result publishing. Refresh the
        # pin with: gh api repos/github/codeql-action/git/tags/<v3 tag object>
        #   --jq .object.sha
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3 (commit, not the tag object — see below)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Scan the one real codebase per language: apps/web/nbproject and
          # apps/web/android framework stubs are generated/IDE metadata.
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3 (commit, not the tag object — see below)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3 (commit, not the tag object — see below)
        with:
          category: "/language:${{ matrix.language }}"
