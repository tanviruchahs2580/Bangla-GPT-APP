name: CodeQL SAST

# Static application security testing over both codebases: the FastAPI
# service (python) and the React dashboard (javascript-typescript). The
# default rule set plus the Security Extended suite runs on every push to
# main and PR, and weekly so CVE rule updates reach the branch even when
# nothing was pushed. Findings land in GitHub's Security tab via SARIF.
#
# Complements (does not duplicate) the existing gates: pip-audit / npm audit
# are dependency-level, gitleaks is secret-level, Trivy is image-level --
# this is the code-level detector the pipeline was missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

concurrency:
  # F-05: a new push to the same ref supersedes the running analysis; the
  # weekly schedule tick runs on the default branch and is unaffected by
  # pull-request groups.
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required for the CodeQL analyze action to upload SARIF results
      security-events: write
      contents: read
      # CodeQL needs pull-requests: read to attribute alerts to changed PR files
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Scan the one real codebase per language: apps/web/nbproject and
          # apps/web/android framework stubs are generated/IDE metadata.
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          category: "/language:${{ matrix.language }}"
