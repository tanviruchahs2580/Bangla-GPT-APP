name: Secret masking verification

# F-18: "masking verified by a dummy-secret test". The claim that GitHub masks
# repository secrets in logs was prose; this workflow makes it a test.
#
# How it works: the first job echoes the value of MASKING_TEST_SECRET (a
# throwaway dummy the owner stores as a repository secret; its value is
# irrelevant and must not be a real credential). The second job downloads that
# job's log through the Actions API and asserts the raw value is absent. If the
# log contains the secret, masking is broken and this run fails loudly; if the
# secret is not configured, both jobs pass with a notice, so the check is a
# no-op rather than a red until the owner sets it up (exact instructions in
# docs/ci.md, "Secret handling and masking").
#
# Dispatch-only on purpose: a scheduled echo of a secret value into a log adds
# no information once it has been verified, and the log is retained either way.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  echo-dummy:
    name: Echo the dummy secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the dummy secret is configured
        id: check
        env:
          DUMMY: ${{ secrets.MASKING_TEST_SECRET }}
        run: |
          if [ -z "${DUMMY:-}" ]; then
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=MASKING_TEST_SECRET not set::Create a repository secret named MASKING_TEST_SECRET with any throwaway value (see docs/ci.md) to enable the masking test."
          else
            echo "configured=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Echo the secret (GitHub must mask it)
        if: steps.check.outputs.configured == '1'
        env:
          DUMMY: ${{ secrets.MASKING_TEST_SECRET }}
        run: |
          # This is the point of the test: the raw value must never appear in
          # the log, and everything that consumes it normally (env expansion,
          # printf) must still be masked.
          echo "masking probe (direct): ${DUMMY}"
          printf 'masking probe (printf): %s\n' "${DUMMY}"
          echo "if this log shows the raw value, GitHub masking did not apply"

  verify-masking:
    name: Verify the log contains no raw value
    needs: echo-dummy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch the echo job's log and assert the raw value is absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUMMY: ${{ secrets.MASKING_TEST_SECRET }}
          CONFIGURED: ${{ needs.echo-dummy.outputs.configured }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${CONFIGURED:-0}" != "1" ]; then
            echo "::notice::MASKING_TEST_SECRET is not configured; the masking test was skipped (see docs/ci.md)."
            exit 0
          fi
          job_id="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Echo the dummy secret") | .id' | head -1)"
          if [ -z "$job_id" ]; then
            echo "::error title=Masking test cannot run::the echo job's id was not found; the verification did not execute."
            exit 1
          fi
          # The job just finished (needs: above); GitHub can still return 404
          # for a moment while the log is flushed, so retry briefly.
          log=""
          for attempt in 1 2 3 4 5 6; do
            if log="$(gh api "repos/${REPO}/actions/jobs/${job_id}/logs" 2>/dev/null)"; then
              break
            fi
            echo "log not available yet (attempt ${attempt}/6); retrying in 10s"
            sleep 10
          done
          if [ -z "$log" ]; then
            echo "::error title=Masking test cannot run::the echo job's log could not be downloaded after 6 attempts."
            exit 1
          fi
          if printf '%s' "$log" | grep -qF -- "$DUMMY"; then
            echo "::error title=SECRET LEAKED INTO THE LOG::the raw MASKING_TEST_SECRET value appears verbatim in the job log. Rotate it and treat the log as exposed."
            exit 1
          fi
          if ! printf '%s' "$log" | grep -q 'masking probe'; then
            echo "::error title=Masking test did not execute::the probe lines are missing from the log, so 'no raw value' proves nothing."
            exit 1
          fi
          echo "OK: the probe ran and the raw secret value is absent from the log (masking verified)."
