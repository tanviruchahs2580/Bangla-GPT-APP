# Dependency updates for every ecosystem actually present in the tree.
#
# Verified against the manifests at c35b6f6:
#   pip             apps/api/pyproject.toml
#   npm             apps/web/package.json  (+ package-lock.json)
#   docker          Dockerfile, apps/web/Dockerfile, deploy/postgres/Dockerfile
#   github-actions  .github/workflows/*.yml (now pinned to commit SHAs)
#
# Grouped per ecosystem so a routine bump produces one reviewable PR instead of
# a dozen. Actions are pinned by SHA, so Dependabot updates the SHA and the
# version comment together.
#
# LABELS (F-029): `dependencies`, `python`, `web`, `docker` and `ci` are
# requested below. None of them existed in the repository's label set, so
# Dependabot was creating PRs that could not be triaged or filtered -- an
# unfiltered dependency queue is how the changelog gate blocked seven of the
# last eight CI runs without anyone noticing (F-027). Create them once:
#
#   gh label create dependencies --color 1D76DB --description "..."
#   gh label create python        --color 1D76DB --description "..."
#   gh label create web           --color 5319E7 --description "..."
#   gh label create docker        --color 2496ED --description "..."
#   gh label create ci            --color BFDADC --description "..."
#
# A severity taxonomy (security / patch / minor / major) is the more
# valuable follow-up: without one, a critical CVE and a typo fix arrive in
# the same queue with the same urgency.

version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]
    commit-message:
      prefix: "build(python)"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
    labels: [dependencies, web]
    commit-message:
      prefix: "build(web)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: docker
    directory: /deploy/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "build(ci)"