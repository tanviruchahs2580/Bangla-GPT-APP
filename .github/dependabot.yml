# Dependency updates for every ecosystem actually present in the tree.
#
# Verified against the manifests at c35b6f6:
#   pip             apps/api/pyproject.toml
#   npm             apps/web/package.json  (+ package-lock.json)
#   docker          Dockerfile, apps/web/Dockerfile, deploy/postgres/Dockerfile
#   github-actions  .github/workflows/*.yml (now pinned to commit SHAs)
#
# Grouped per ecosystem so a routine bump produces one reviewable PR instead of
# a dozen. Actions are pinned by SHA, so Dependabot updates the SHA and the
# version comment together.
#
# LABELS (F-GIT-7 / F-102): `dependencies`, `python`, `web`, `docker` and `ci`
# are requested below. None of them existed in the repository's label set when
# this was checked on 2026-10-29, and Dependabot silently drops labels that do
# not exist -- so until an owner creates them the PRs arrive unlabelled and
# cannot be filtered. Create them once (repository admin scope required):
#
#   gh label create dependencies --color 1D76DB --description "..."
#   gh label create python        --color 1D76DB --description "..."
#   gh label create web           --color 5319E7 --description "..."
#   gh label create docker        --color 2496ED --description "..."
#   gh label create ci            --color BFDADC --description "..."
#
# The alternative -- shipping labels the repository does not have and hoping
# they appear -- is what left the queue unfiltered while the changelog gate
# blocked seven of eight CI runs (F-027). A severity taxonomy (security /
# patch / minor / major) remains the more valuable follow-up: without one, a
# critical CVE and a typo fix arrive with the same urgency.
#
# Group review (2026-10-29): every group now carries `update-types: [minor,
# patch]`, so a routine bump still arrives as one reviewable PR while a major
# (react 19, vite 8, TypeScript 7, capacitor 8 -- the 2026-10 queue) arrives
# separately. The old pattern-only groups bundled majors with patches, which is
# how the web group went red on four jobs at once (F-SUP-3).

version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, python]
    commit-message:
      prefix: "build(python)"
    ignore:
      # Dependabot reads constraints.txt, and a pip-compile lock carries only
      # `==` pins -- no ranges -- so the ceiling arq imposes on redis is
      # invisible to it. It therefore keeps offering redis 6/7/8, none of which
      # can ever install: arq (0.28.0, the newest release) requires
      # `redis[hiredis]<6`. PR #20 did exactly that; five required checks died
      # with `ResolutionImpossible` and dependency updates stopped landing.
      #
      # 5.x releases, including security patches, are NOT ignored -- only the
      # majors that cannot coexist with arq. Delete this entry when arq widens
      # its range:
      #   python -c "import importlib.metadata as m; print(m.requires('arq'))"
      - dependency-name: "redis"
        versions: [">=6"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, web]
    commit-message:
      prefix: "build(web)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: docker
    directory: /deploy/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: "build(ci)"
