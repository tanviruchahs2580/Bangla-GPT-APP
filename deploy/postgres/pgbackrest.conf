# S5.7 pgBackRest stanza config -- mounted read-only into the database
# container (archive-push) and the backup sidecar (backup/restore/drill).
# repo1 is a plain POSIX path (compose volume); pointing it at an
# S3-compatible endpoint is a repo1-type=s3 switch (repo1-s3-endpoint,
# repo1-s3-bucket, ...) -- same drill, off-site storage.
[global]
repo1-path=/repo
# 14 full backups (~2 weeks nightly) retained; diffs/prunes handled by pgBackRest.
repo1-retention-full=14
repo1-retention-diff=7
compress-type=zst
process-max=2
log-level-console=info
log-level-file=detail
start-fast=y

[bgpt]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
# superuser role created by the compose postgres service
# (POSTGRES_USER default bgpt); unix-socket trust auth maps any OS user to it.
pg1-user=bgpt
