# S5.7 pgBackRest stanza config -- mounted read-only into the database
# container (archive-push) and the backup sidecar (backup/restore/drill).
# repo1 is a plain POSIX path (compose volume); pointing it at an
# S3-compatible endpoint is a repo1-type=s3 switch (repo1-s3-endpoint,
# repo1-s3-bucket, ...) -- same drill, off-site storage.
[global]
repo1-path=/repo
# AUD-B-03: encrypt the repository at rest. The repo holds minors' chat,
# quiz and profile rows, so a plaintext volume (or a copied volume) is not
# an acceptable failure mode. pgBackRest 2.59.1 accepts exactly two values
# here -- 'none' and 'aes-256-cbc' (verified: `pgbackrest
# --repo1-cipher-type=bogus info` lists them); 'aes-256-ctr' is rejected.
#
# The passphrase is deliberately NOT in this tracked file. Both containers
# read it from the PGBACKREST_REPO1_CIPHER_PASS environment variable
# (compose: PGBR_CIPHER_PASS, default empty). With the cipher enabled and no
# passphrase, pgBackRest fails loudly (`info command requires option:
# repo1-cipher-pass`) instead of quietly writing plaintext.
#
# Keep the passphrase in the host secret store, OUTSIDE this repo and
# outside the backup repo: losing it makes every backup unrecoverable
# (see docs/backup_dr.md, "Key loss caveat").
repo1-cipher-type=aes-256-cbc
# 14 full backups (~2 weeks nightly) retained; diffs/prunes handled by pgBackRest.
repo1-retention-full=14
repo1-retention-diff=7
compress-type=zst
process-max=2
log-level-console=info
log-level-file=detail
start-fast=y

[bgpt]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
# superuser role created by the compose postgres service
# (POSTGRES_USER default bgpt); unix-socket trust auth maps any OS user to it.
pg1-user=bgpt
