groups:
  - name: bangla-gpt-api-slo
    rules:
      - alert: HighHTTP5xxRate
        expr: >
          sum(rate(bgpt_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(bgpt_http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx rate above 2% for 5 minutes"
          description: "Error budget burn — investigate logs of the api service immediately."

      - alert: HighP95Latency
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(bgpt_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s for 10 minutes"
          description: "Check LLM provider latency, DB load and worker saturation."

      - alert: APIScrapeDown
        expr: up{job="bangla-gpt-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot reach the API /metrics endpoint"
          description: "The api service is down or /ready is failing. Check container health."

      - alert: UnhandledExceptions
        expr: increase(bgpt_http_unhandled_exceptions_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Unhandled exceptions escaping the API in the last 10 minutes"

      # Fires only when a node_exporter target is configured (optional).
      - alert: DiskNearFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 80% on {{ $labels.instance }} ({{ $labels.mountpoint }})"

      # RAG grounding health: the refusal signal catching silent corpus
      # degradation (e.g. NCTB_CORPUS_DIR mis-set in production, so the tutor
      # fell back to the 78-chunk bundled sample and every real question is
      # refused). Measured over gated retrieval traffic only.
      - alert: HighRAGRefusalRate
        expr: >
          sum(rate(bgpt_rag_gate_refusals_total{reason="insufficient_evidence"}[15m]))
          / clamp_min(sum(rate(bgpt_rag_gate_outcomes_total[15m])), 0.001) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RAG evidence gate refuses >50% of grounded attempts for 15 minutes"
          description: >
            Likely corpus degradation (NCTB_CORPUS_DIR mis-set / corpus too small) or a
            retrieval regression. Check bgpt_rag_index_chunks and the rag_corpus_loaded boot log.

      # Post-generation honesty signal: a citation check that fails means the
      # answer leaned on material the evidence does not support.
      - alert: RAGCitationCheckFailures
        expr: increase(bgpt_rag_citation_checks_total{result="fail"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Citation verification failed on a grounded answer in the last 15 minutes"
          description: "Inspect the ai_call / tutor_retrieval logs for the affected request id."
