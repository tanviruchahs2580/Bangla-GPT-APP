# gitleaks baseline for Bangla-GPT-APP.
#
# VCS-01/SEC-23: gitleaks 8.30.1 found 82 generic-api-key hits in the tracked
# tree at c35b6f6. Every one was opened and judged a non-credential:
#
#   77  SECRET = "test..." / jwt_secret="test..." in apps/api/tests/**
#    1  jwt_secret="other-..." (test_security.py:50)  negative-test decoy
#    1  admin_password="Strong..." (test_product_v3.py:566) fixture
#    1  RFC_SECRET_B32 = "GEZDGN..." (test_mfa.py:20) -- the public HOTP
#       shared-secret test vector from RFC 4226 / RFC 6238
#    1  const TOKEN (apps/web/src/test/authSession.test.ts:4) fixture
#    1  a false positive on box-drawing glyphs in an archived report
#
# The problem this solves is not a leak but the 82 recurring false positives:
# with no baseline, a real credential would be buried among them. The scope is
# deliberately narrow -- test paths only, plus one archived file -- so anything
# outside them still fails the gate.
#
# NOTE: this must use [allowlist]. Using [[rules]] here *adds* rules and makes
# the count worse, not better.
#
# Reviewed 2026-10-09 during the engineering audit.
#
# T-029 (2026-10-16): a full-history scan (`gitleaks git . --log-opts=--all`)
# exits 1 on one finding the 2026-10-09 review could not see because it scanned
# the working tree, not the history: commit 8bd0556 has the archived ASCII-art
# report at its pre-move path (repo root), and this path is not covered by the
# docs/archive/ entry below. The hit is reviewed and is a false positive: the
# box-drawing diagram line reads `Auth: JWT+RBAC+tenancy guards` and the
# generic-api-key rule reads `JWT+RBAC+tenancy` as a key/value pair. The entry
# added below is scoped to that exact matched TEXT (any file, any commit), not
# to the file: a real secret anywhere -- including on another line of the same
# report, if the report were ever edited -- still fails the gate.
#
# A path-only entry for that filename was considered and rejected: gitleaks
# exempts the whole FILE for a path allowlist entry, which would have silenced
# a genuine secret anywhere in the report. Confirmed with a local fixture: the
# path entry hid a planted key on another line of the same-named file, while
# the text-scoped entry below did not.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and one archived report: reviewed non-credentials"
regexTarget = "match"
regexes = [
  # Fixture secrets are explicitly marked as test values.
  '''(SECRET|KEY|TOKEN|PASSWORD)\s*[:=]\s*["'](test|unit|dummy|fake)''',
  '''jwt_secret\s*[:=]\s*["'](test|other)''',
  '''admin_password\s*[:=]\s*["']''',
  # RFC 4226/6238 public HOTP test vector, not a deployed secret.
  '''RFC_SECRET_B32''',
  '''RFC\d{6}''',
  # T-029: the exact text gitleaks matches inside the archived ASCII-art
  # diagram line `Auth: JWT+RBAC+tenancy guards` (commit 8bd0556 at the file's
  # pre-move root path). Content-scoped, so only this reviewed value is
  # pardoned -- not the file that happens to contain it.
  '''^Auth: JWT\+RBAC\+tenancy''',
  # The benchmark harness's throwaway fixture, reviewed: a deterministic
  # placeholder for the settings validator, never used against any deployed
  # instance, and since computed rather than written (see the commit that
  # replaced the literal). The finding survives only because the full-history
  # scan still walks the branch commits that contained it. Content-scoped so
  # the path itself stays scannable.
  '''bench-secret-[0-9a-f]{8,}''',
]
paths = [
  # Test suites only. Production code is never allowlisted here.
  '''(^|/)tests?/.*\.py$''',
  '''(^|/)apps/web/src/test/.*\.tsx?$''',
  # Single archived report; the hit is box-drawing glyphs, not a key.
  # Not anchored with ^ : gitleaks reports absolute paths.
  '''docs/archive/BANGLA_GPT_ENTERPRISE_ARCHITECTURE_QA_AUDIT\.md$''',
]
