# gitleaks baseline for Bangla-GPT-APP.
#
# VCS-01/SEC-23: gitleaks 8.30.1 found 82 generic-api-key hits in the tracked
# tree at c35b6f6. Every one was opened and judged a non-credential:
#
#   77  SECRET = "test..." / jwt_secret="test..." in apps/api/tests/**
#    1  jwt_secret="other-..." (test_security.py:50)  negative-test decoy
#    1  admin_password="Strong..." (test_product_v3.py:566) fixture
#    1  RFC_SECRET_B32 = "GEZDGN..." (test_mfa.py:20) -- the public HOTP
#       shared-secret test vector from RFC 4226 / RFC 6238
#    1  const TOKEN (apps/web/src/test/authSession.test.ts:4) fixture
#    1  a false positive on box-drawing glyphs in an archived report
#
# The problem this solves is not a leak but the recurring false positives:
# with no baseline, a real credential would be buried among them.
#
# GIT-02/F-100 (2026-10-30): the baseline used to allowlist two whole test
# file globs (`(^|/)tests?/.*\.py$`, `(^|/)apps/web/src/test/.*\.tsx?$`), so a
# genuine secret pasted into any test file would never fail the gate. The path
# entries are gone: every reviewed non-credential is now expressed as a
# value-shaped regex (the pattern the admin_password entry already used), and
# `gitleaks git . --log-opts=--all` and a scan of the tracked tree both report
# zero findings with this file. A planted synthetic key under apps/api/tests/
# is still reported (verified while writing this change).
#
# NOTE: this must use [allowlist]. Using [[rules]] here *adds* rules and makes
# the count worse, not better.

[extend]
useDefault = true

[allowlist]
description = "Reviewed non-credentials, scoped by value, never by path"
regexTarget = "match"
regexes = [
  # Fixture secrets that name themselves test/unit/dummy/fake values.
  '''(SECRET|KEY|TOKEN|PASSWORD)\s*[:=]\s*["'](test|unit|dummy|fake)''',
  # jwt_secret fixtures, in both Python-kwarg and JSON spellings. `test-`
  # covers the older fixtures, `other-` the negative-test decoy, `bench-` the
  # bench script's throwaway, `w2-obs-` the wave-2 observability suite's
  # named constant (used as a jwt_secret in test_w2_obs_request_id.py).
  '''jwt_secret["']?\s*[:=]\s*["'](test|other|bench)-''',
  '''SECRET\s*=\s*["']w2-obs-secret-''',
  # The CI DAST job's placeholder JWT secret (commit removed since).
  '''JWT_SECRET=(ci-dast|bench)-secret-''',
  # The shared 57-character high-entropy constant the boot-guard suites need:
  # the production entropy guard (F-067) rejects short values, so the tests
  # use one full-literal fixture -- full-literal here too, so any other value
  # still fails.
  '''Zk7Qp2XvN8mR4tYcW1bH6jL3sD9fG5aE0uI2oP7xV4qM8nC6rT1wY3zB5''',
  # The redaction test's fake API key (an explicit 0-9a-j placeholder run).
  '''api_key["']?\s*[:=]\s*["']sk-0123456789abcdefghij''',
  # The old corpus quality report's token_counter value; a counter name the
  # generic-api-key rule reads as a key/value pair.
  '''token_counter["']?\s*[:=]\s*["']heuristic-''',
  # The canonical jwt.io example token, used as the frontend fetch fixture.
  # Its header/payload are public constants; the signature is a placeholder.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxIiwicm9sZSI6InN0dWRlbnQifQ\.sig''',
  # AUD-2026-10-27: was value-unanchored, which whitelisted ANY
  # `admin_password = "<anything>"` assignment tree-wide -- exactly the
  # platform's highest-value credential. Anchored to the seven reviewed
  # weak test-fixture literals (all under apps/api/tests/); any other
  # admin password literal is now reportable.
  '''admin_password["']?\s*[:=]\s*["'](longenoughpass1|longenough123|supersecret1|short12|longpassword123|StrongPass123|Str0ngAdminPassw0rd!)''',
  # RFC 4226/6238 public HOTP test vector, not a deployed secret.
  '''RFC_SECRET_B32''',
  '''RFC\d{6}''',
  # AUD-B-17: the deleted smoke script's literal test secret, judged a
  # non-credential (owner rotation decision recorded in issue #51). It is
  # referenced only by extinct history commits; anchoring to the value
  # prefix keeps this a no-op for anything real.
  '''SECRET\s*=\s*["']smoke-secret''',
  # T-029: the exact text gitleaks matches inside the archived ASCII-art
  # diagram line `Auth: JWT+RBAC+tenancy guards` (commit 8bd0556 at the file's
  # pre-move root path). Content-scoped, so only this reviewed value is
  # pardoned -- not the file that happens to contain it. A path entry for that
  # report was considered and rejected for the same reason.
  '''^Auth: JWT\+RBAC\+tenancy''',
]
