# Pre-commit hooks -- F-018
#
# There was no pre-commit gate of any kind: every one of these checks ran
# only in CI, so the feedback arrived after the commit, after the push and
# often after a review. `pre-commit install` puts them in front of
# `git commit`.
#
# The hook ids are pinned, and the hook set is deliberately a SUBSET of what
# CI runs -- CI stays the authority. A hook that fails in a way the developer
# cannot fix locally gets removed rather than left to annoy everyone:
# check_readme_contract.py and check_i18n.py need the full apps/web tree and
# so stay in CI only.
#
# CI enforcement: `.github/workflows/ci.yml` (guardrails job) runs
# `pre-commit run --all-files` against the pinned revision below, so a tree
# that violates this file cannot merge. Keep the two in step.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
        # Visual-regression baselines are pixels, not data: Playwright compares
        # them byte-for-byte per run, so they cannot be compressed on the fly.
        # The directory is the one justified exception to the size cap -- 60
        # reviewed baselines, ~16 MB total, and the six login shots run
        # 512-762 KB because the splash backdrop is a photograph. Everything
        # else stays capped at 512 KB.
        exclude: ^apps/web/e2e/__screenshots__/
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes pins *.ps1 to CRLF (`*.ps1 text eol=crlf`, for the
        # Windows PowerShell helpers under apps/web) and .editorconfig agrees
        # ([*.{bat,ps1}] end_of_line = crlf), so --fix=lf was rewriting
        # apps/web/run_web_tests.ps1 to LF on every run and contradicting a
        # checked-in attribute. The attribute file wins; this hook keeps
        # normalising every other text file to LF. (T-040b)
        exclude: \.ps1$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(apps/api/(src|tests|scripts)/|scripts/)
      - id: ruff-format
        # D-01: the formatter used to cover apps/api only, so the guard scripts
        # under scripts/ were never format-checked even though the ruff *lint*
        # hook above already ran over them. Same file set as that hook now; the
        # root ruff.toml supplies the line length they are formatted to.
        files: ^(apps/api/(src|tests|scripts)/|scripts/)

  # F-13: commit-message lint in front of the commit, not after the push. The
  # hook is local (not a published repo) because it calls the repository's own
  # scripts/check_commits.py, so the rule the hook applies is exactly the rule
  # the `Commit subjects (PR range)` CI step applies -- one implementation,
  # two entry points (history and one message file).
  - repo: local
    hooks:
      - id: commit-subject-conventional
        name: commit subject (Conventional Commits, matching CI)
        entry: python scripts/check_commits.py
        language: system
        stages: [commit-msg]

# Exclusions for generated corpora, eval fixtures and the frozen docs archive.
#
# T-040a: this pattern used to end the group with `$` right after the bare
# directory names, e.g. `^(...|apps/api/eval/|docs/archive/)$`. In `(?x)` mode
# those lines compile to `^(docs/archive/)$`, which only matches a path that is
# literally the directory -- no real file under it -- so the exclusions were
# silently dead and the file-hygiene hooks rewrote the archive. The per-hook
# `exclude: ^apps/api/eval/` did NOT replace this setting (pre-commit applies
# the top-level `files`/`exclude` once to build the candidate list, then the
# hook's own `files`/`exclude` as a further filter: they combine with AND);
# it worked only because that regex is a plain unanchored search.
#
# `.*` after each directory makes the pattern match the files inside it. Each
# hook-level `exclude` adds to this filter, never replaces it.
exclude: |
  (?x)^(
    data/nctb/(raw|extracted|normalized)/.*|
    apps/api/eval/.*|
    docs/archive/.*
  )$
