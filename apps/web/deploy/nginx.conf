server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the SPA bundle. Deliberately declared here, NOT inside
    # any /api/ block below: the deploy contract (parked spec
    # apps/api/eval/parked_specs/test_deploy_contracts.py) pins "gzip" out of
    # the API locations, where a compressing proxy can defeat the streaming
    # the tutor needs.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Docker embedded DNS with request-time resolution: nginx must start
    # even when the api container is not yet resolvable (otherwise any web
    # restart while DNS blips is a fatal [emerg]). The $api_upstream variable
    # forces resolution per request instead of once at startup.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    # Security headers: nginx does not inherit add_header from an outer level
    # once an inner level declares its own, so every location includes the
    # snippet (apps/web/deploy/security-headers.conf) instead of repeating the
    # header set. A block that forgets the include silently serves responses
    # without them, and the deploy contract test fails.

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Non-streaming calls only: the SSE route below overrides this.
        proxy_read_timeout 75s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Tutor SSE stream (POST /api/tutor/conversations/<id>/messages/stream).
    # Buffering held every token until the answer ended, so the "streaming"
    # chat arrived as one blob; and the 75s read timeout cut long generations
    # mid-answer. proxy_buffering off streams each chunk as it is written; the
    # long read timeout is scoped to this route so a hung ordinary request
    # still fails fast. The app does not set X-Accel-Buffering itself, so it
    # is declared here for any plain-nginx hop in front of this container.
    location ~ ^/api/tutor/conversations/[0-9]+/messages/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite content-hashes filenames under /assets/, so those are safe to pin
    # for a year. The un-hashed entry points below must stay revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # A cached service worker outlives the deploy that wrote it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Other static files (icons, the manifest, copied fonts) are not hashed,
    # so they get a week rather than a year.
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
