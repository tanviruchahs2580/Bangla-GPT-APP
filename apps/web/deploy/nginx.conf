server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static dashboard
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker embedded DNS with request-time resolution: nginx must start
    # even when the api container is not yet resolvable (otherwise any web
    # restart while DNS blips is a fatal [emerg]). The $api_upstream variable
    # forces resolution per request instead of once at startup.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # SSE token stream (H-16). nginx buffers proxied responses by default, so
    # this one route needs buffering disabled explicitly: with it on, a
    # student sees the whole answer arrive at once (or nothing) instead of
    # token-by-token. The regex location matches only the streaming route, so
    # every other /api/ call above keeps the default buffering.
    location ~ ^/api/tutor/conversations/[^/]+/messages/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Long-lived stream: the 75s default would cut a slow generation.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
