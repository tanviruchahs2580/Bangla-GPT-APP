server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static dashboard. The CSP mirrors
    # apps/web/vercel.json (the Vercel deployment is the public path; this
    # container is the self-hosted and :8081-direct path, which had NO CSP at
    # all). The SPA ships no inline script (public/theme-boot.js is a static
    # file), so script-src stays 'self'; style-src needs 'unsafe-inline' for
    # React style attributes; blob: covers photo previews and generated
    # download URLs; *.sentry.io is the optional error reporter.
    #
    # nginx gotcha that is deliberate here: add_header in a nested location
    # REPLACES all inherited add_header directives, so any location that adds
    # its own header must repeat this set (the asset location below does).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.sentry.io; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker embedded DNS with request-time resolution: nginx must start
    # even when the api container is not yet resolvable (otherwise any web
    # restart while DNS blips is a fatal [emerg]). The $api_upstream variable
    # forces resolution per request instead of once at startup.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        # add_header here overrides the server-level set, so it is repeated.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.sentry.io; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public";
    }
}
