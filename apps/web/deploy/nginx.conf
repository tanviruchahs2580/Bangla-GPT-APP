server {
    # B-24: 8080, not 80 -- the image runs as uid 101 (nginx-unprivileged)
    # and a non-root process cannot bind a privileged port without a
    # capability. Caddy proxies `web:8080`.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static dashboard
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker embedded DNS with request-time resolution: nginx must start
    # even when the api container is not yet resolvable (otherwise any web
    # restart while DNS blips is a fatal [emerg]). The $api_upstream variable
    # forces resolution per request instead of once at startup.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # SSE token stream (H-16). nginx buffers proxied responses by default, so
    # this one route needs buffering disabled explicitly: with it on, a
    # student sees the whole answer arrive at once (or nothing) instead of
    # token-by-token. The regex location matches only the streaming route, so
    # every other /api/ call above keeps the default buffering.
    location ~ ^/api/tutor/conversations/[^/]+/messages/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Long-lived stream: the 75s default would cut a slow generation.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache policy (AUD-G-13 / G-16). Vite writes the app bundle and every
    # webfont under /assets/ with a content hash in the file name, so those
    # bytes can never change under the same URL: cache them for a year and
    # mark them immutable. Everything served under a *stable* name has to
    # revalidate, or a deploy is invisible for a week: the old rule applied
    # `expires 7d` to every .js/.css/.png including the service worker, the
    # web manifest and index.html, which is how a client can keep running a
    # previous release. `vite preview` mirrors this policy (vite.config.ts).
    #
    # nginx does not inherit `add_header` into a location that declares one of
    # its own, so the three security headers are repeated in each block below.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # The service worker must be re-fetched on every navigation: a cached copy
    # cannot update itself, and it is what decides when the new bundle takes
    # over (public/sw.js, versioned cache bgpt-v2).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Small, stable public/ files: a stale manifest or theme boot script pins
    # the wrong language/theme or the wrong icon set on an installed PWA.
    location ~ ^/(manifest\.webmanifest|theme-boot\.js|icons/) {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The HTML shell references the hashed assets, so it is the one document
    # that must never be served stale -- and the SPA fallback for every route.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
