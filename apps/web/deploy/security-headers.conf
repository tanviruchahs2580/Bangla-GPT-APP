# Security headers shared by every location block.
#
# They must be included in EACH block rather than set once at server level:
# nginx does not inherit add_header from an outer level once the inner level
# declares any add_header of its own. That inheritance rule is exactly why the
# headers were previously being dropped on every static asset.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
