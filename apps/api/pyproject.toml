[project]
name = "bangla-gpt-api"
version = "0.9.3"
description = "Bangla GPT APP - NCTB-grounded AI tutor platform (API service)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bangla GPT APP contributors" }]
keywords = [
    "education",
    "bengali",
    "nctb",
    "tutor",
    "rag",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Bengali",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "uvicorn-worker>=0.2",
    # SCS-06: pydantic and starlette are imported directly across the codebase,
    # so they are declared rather than relied on transitively via fastapi.
    "pydantic>=2.7",
    # SCS-06: schemas.py imports PydanticCustomError from pydantic_core
    # directly. pydantic pins its own pydantic-core exactly, so this floor
    # only records the direct import; deptry's DEP003 was the signal.
    "pydantic-core>=2.7",
    "starlette>=0.37",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "alembic>=1.13",
    "prometheus-client>=0.21",
    "pypdf>=5.0",
    # Declared because it is imported directly: the chat image path
    # decodes and re-encodes every attached photo to strip its metadata
    # (providers/image_safety.py). It used to arrive transitively via
    # reportlab, which is not a contract.
    "pillow>=11",
    "bijoy2unicode>=0.1.1",
    # The ceiling is arq's, not ours: arq (0.28.0, the newest release) requires
    # `redis[hiredis]<6`, so no redis 6/7/8 can be installed beside it. Spelling
    # that out here is what makes the manifest satisfiable and stops a resolver
    # from proposing redis 8.1.0 -- which is how the dependency-update queue
    # went red and stopped landing updates in the first place. Re-check the
    # bound when arq widens its range:
    #   python -c "import importlib.metadata as m; print(m.requires('arq'))"
    "redis>=5.0,<6",
    "arq>=0.26",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.0",
    "fpdf2>=2.8.3",
    # fpdf2 declares uharfbuzz only as a *test* extra, but it is a RUNTIME
    # requirement for this project: services/qp_pdf.py calls
    # set_text_shaping(True) at two sites, and that is what turns Bengali
    # conjuncts into shaped glyphs instead of decomposed sequences with
    # detached vowel signs. Without it fpdf raises FPDFException at the
    # first PDF. Declared here deliberately; do not remove.
    "uharfbuzz>=0.40",
    # S5.6: Fernet encryption for guardian phone at rest (security.py).
    "cryptography>=42",
    # SEC-02: Argon2id password hashing (OWASP-recommended parameters).
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  # F-151: scripts/check_lockfile.py parses the pins with `packaging` and runs
  # in the guardrails job on every PR. It only arrived transitively before,
  # so a lock refresh could have turned a green gate into an ImportError.
  "packaging>=24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The wheel must ship every data file the runtime loads by path: sample corpus,
# the S5 knowledge graph, and the Bengali TTF embedded in generated PDFs. The
# font's SIL OFL licence travels with it (OFL-1.1 requires the licence to
# accompany every copy).
bangla_gpt_api = [
    "data/sample_nctb/*.md",
    "data/kg/*.json",
    "data/fonts/*.ttf",
    "data/fonts/OFL.txt",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["alembic", "eval/parked_specs"]

[tool.ruff.lint]
# Families added in CQ-01, each with the violations it surfaces either fixed
# at the call site or justified below.
#
# C901 (C90) enforces the complexity budget: max-complexity 20 is the radon
# "no grade D or worse" line, and the same number is enforced independently by
# the radon ratchet step in .github/workflows/ci.yml. The functions still
# above it live in files owned by other wave-2 workstreams (or are the three
# end-to-end test flows); each carries a per-file ignore below naming the
# function and its score. That list is a ratchet: it may only shrink, a new
# entry needs a written reason, and the budget itself only falls.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit - security-relevant, worth the false positives
    "DTZ",  # naive datetime hazards
    "T20",  # stray print()
    "ERA",  # commented-out code
    "SIM",  # simplifications
    "RUF",  # ruff-specific correctness
    "PERF", # obvious performance traps
    "ASYNC",# async footguns
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "C901", # complexity (rated against mccabe.max-complexity; see the ratchet)
]

# Every entry is a deliberate decision, not a backlog:
#   E501            - line length is enforced by `ruff format`, which does not
#                     produce unreadable wrapping; duplicating it as a lint
#                     rule only creates conflicts with the formatter.
#   RUF001/002/003  - "ambiguous" unicode. Bengali legitimately uses these
#                     code points (Bengali digits, the U+09DC/U+09DD nukta
#                     forms); flagging them would force the product's own
#                     script to be escaped. The Bangla hygiene scanner
#                     (scripts/bn_scan.py) is the check that matters here.
#   N818            - exception naming. The codebase has established
#                     `CacheUnavailable`, `OcrUnavailable`,
#                     `ProviderNotConfigured`; renaming them would churn
#                     every call site and test to satisfy a style rule.
#   N813            - the one camelcase import is a deliberate alias for a
#                     lazily imported class, so the local name is lowercase.
#   T201 (cli)     - `src/bangla_gpt_api/evaluation/cli.py` and
#                     `src/bangla_gpt_api/evaluation/fairness_probes.py` are
#                     command-line tools; printing is their output contract.
#   B011 (tests)    - test_phase1_exploits.py asserts that `assert False` and
#                     friends are caught by static analysis. Removing the
#                     literals would delete the test's subject matter.
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "N818",
    "N813",
    # DTZ001/DTZ901 want tz-aware datetimes. This project stores naive UTC on
    # purpose - SQLite has no timezone type and the schema reads naive - so
    # "fixing" these would mix aware and naive values and raise TypeError at
    # comparison time. The rest of DTZ stays on (DTZ005, DTZ011, DTZ007 ...).
    "DTZ001",
    "DTZ901",
    # RUF100 reports noqa comments that ARE load-bearing: a suppression placed
    # on a name inside a parenthesised `from x import (...)` block is reported
    # by F401 against that name's column, and RUF100 fails to map it back.
    # Verified by stripping the suppressions: F401 then fires. Enabling RUF100
    # would delete working suppressions, so it stays off.
    "RUF100",
    # ERA001 reads this codebase's formula and pseudo-code comments (how a
    # confidence score is computed, what a lifespan step does) as commented-out
    # code. All five hits are documentation, not dead code.
    "ERA001",
    # PERF401 rewrites `for ..: out.append(f(x))` into a comprehension. That is
    # a style preference with no measurable effect at this scale, and it would
    # mean rewriting twelve working code paths for no behavioural gain. The
    # rest of PERF stays on (PERF403 and friends do catch real waste).
    "PERF401",
]
# TOML has no comments inside an inline table, so the rationale lives here and
# the table itself stays bare.
#
#   evaluation/cli.py  it is a CLI; printing is its output contract
#   scripts/*         command-line tooling: printing is the output contract,
#                     the gate scripts assert their own preconditions, and the
#                     eval harness uses subprocesses and random sampling
#   tests/test_phase1_exploits.py
#                     asserting that static analysis catches `assert False`
#                     requires writing it
#   tests/*           `assert` IS the mechanism in a test, and fixture
#                     credentials, literal SQL, subprocess calls, prints in
#                     diagnostics and unused unpacked fixtures are how tests
#                     are written
[tool.ruff.lint.mccabe]
# radon's D grade starts at 21, so a function at or below this is never a
# D-or-worse block in the CI radon ratchet.
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# C901 ratchet (F-006/BE-05). Each line is a debt marker with the score ruff
# measured when the entry was recorded, not an exemption policy: when the
# function is split, the line must be deleted, and the budget only falls.
# These three hold functions above max-complexity 20 and belong to other
# wave-2 workstreams (the nctb pipeline and the tutor service); the split is
# handed to their owners rather than done across the boundary.
"src/bangla_gpt_api/data/nctb_loader.py" = ["C901"]  # load_nctb_corpus 23
"src/bangla_gpt_api/nctb/chunking.py" = ["C901"]     # chunk_pages 23
"src/bangla_gpt_api/services/tutor.py" = ["C901"]    # ask_stream 21
"src/bangla_gpt_api/evaluation/cli.py" = ["T201"]
"src/bangla_gpt_api/evaluation/fairness_probes.py" = ["T201", "C901"]  # validate_fixture E(32)
"scripts/*" = ["T201", "S101", "S603", "S311", "S607", "S404"]
"tests/test_phase1_exploits.py" = ["B011"]
"tests/*" = [
    "S101",    # assert used
    "S105",    # hardcoded password (fixture strings)
    "S106",    # hardcoded password argument (fixture strings)
    "S311",    # random (shuffling fixtures)
    "S608",    # SQL string construction (asserted against injection)
    "S603",    # subprocess call (test tooling)
    "T201",    # print() in test diagnostics
    "T203",    # pdb
    "ASYNC240",
    "RUF059",  # unused unpacked variable in fixtures
    "SIM117",  # nested with statements in fixtures
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A deprecation warning is a dated dependency or a dated call site; the audit
# found the suite reporting one and shipping it silently (F-159/TEST-01), so
# the whole suite treats them as failures. The single accepted exception is
# starlette's httpx shim inside its own TestClient: it is the framework's
# transition notice, fired from third-party code this repo does not own, and
# it disappears when starlette ships the shimmed import by default. Removing
# this ignore is the goal of the next starlette upgrade.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
markers = [
    "skipif: conditional skip (pytest.mark.skipif)",
    "integration: slow integration tests requiring external services",
]

[tool.coverage.run]
source = ["bangla_gpt_api"]
# Branch coverage belongs in the config, not only in the CI command line: a
# local run must measure what the gate enforces (F-058).
branch = true
omit = [
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
# Coverage was measured but never gated: fail_under was 0, no CI job passed
# --cov, and pytest-cov was not even a declared dev dependency, so the number
# could not be reproduced from the declared environment. Baseline measured
# 87.62% on 2026-10-09; 80 is set with headroom so this gate is about catching
# regressions, not about pretending the gap is closed. Per-module floors for
# the critical paths are the follow-up (TST-04).
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ ==",
]

[tool.deptry]
# CQ-03: without this, deptry does not recognise the project's own package as
# first party and reports every `from bangla_gpt_api... import ...` as
# "DEP003 imported but it is a transitive dependency" -- 392 findings (of 404)
# on this tree, which buried the real ones. The distribution is
# `bangla-gpt-api`, the import package is `bangla_gpt_api` under src/, and
# deptry resolves first-party packages from `[project] name`/src layout only
# when told the module name explicitly.
#
# Still reported, deliberately not silenced here:
#   DEP002 - gunicorn, uvicorn-worker, psycopg, uharfbuzz (used through the
#            Dockerfile CMD / SQLAlchemy driver URL / fpdf2 runtime shaping,
#            never via an `import` deptry can see), and the dev tools
#            (pytest-asyncio, pytest-cov, ruff, mypy, pip-audit) that are
#            executed, not imported.
#   DEP001 - `_changelog_common`, a sibling module of the scripts in
#            apps/api/scripts/ imported through a sys.path insert (its own
#            module, not a distribution). Add it to known_first_party if
#            deptry is ever wired into CI.
# DEP003 is empty since 2026-10-29: `packaging` (scripts/check_lockfile.py)
# and `pydantic_core` (schemas.py) are declared on purpose instead.
known_first_party = ["bangla_gpt_api"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["alembic"]

# CQ-02: strictness is turned on per-flag, not all at once, because a single
# `--strict` jump would have required rewriting 161 annotations and 24
# signatures in one commit. Every flag below is on because the codebase
# already satisfies it; the measured path to full `--strict` is written down in
# docs/type-checking-plan.md, including which flags are still off and why.
warn_unused_configs = true      # a [[overrides]] block that matches nothing
warn_redundant_casts = true     # a cast that changes nothing
warn_unused_ignores = true      # dead suppressions (AUD-0018's failure mode)
warn_return_any = true          # a function whose `Any` return hides the contract
no_implicit_optional = true     # `x: int = None` is not an int
strict_equality = true          # silent True/1 equality across types
check_untyped_defs = true       # bodies of untyped functions are still checked
warn_unreachable = true         # dead code after a terminating branch
no_implicit_reexport = true     # `import x` must say `from x import y as y`
strict_bytes = true

# Still off, deliberately, with the measured cost on 2026-10-10:
#   disallow_any_generics    161 - bare `dict`/`list` annotations that need a
#                                   per-site decision about key/value types
#   disallow_untyped_defs     24 - untyped public functions
#   disallow_untyped_decorators, disallow_any_decorated, no_partialtypes,
#   disallow_subclassing_any, extra_checks - no measurable benefit today
# Removing any of the above from this list is a deliberate act: see the plan.

# bijoy2unicode ships no stubs/py.typed (import-untyped at the lazy import in
# nctb/bijoy.py); silence that code at the single import site.
[[tool.mypy.overrides]]
module = "bangla_gpt_api.nctb.bijoy"
disable_error_code = "import-untyped"
