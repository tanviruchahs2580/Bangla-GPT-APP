[project]
name = "bangla-gpt-api"
version = "0.6.2"
description = "Bangla GPT APP - NCTB-grounded AI tutor platform (API service)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "uvicorn-worker>=0.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "alembic>=1.13",
    "prometheus-client>=0.21",
    "pypdf>=5.0",
    "bijoy2unicode>=0.1.1",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.0",
    "fpdf2>=2.8.3",
    "uharfbuzz>=0.40",
    # S5.6: Fernet encryption for guardian phone at rest (security.py).
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The wheel must ship every data file the runtime loads by path: sample corpus,
# the S5 knowledge graph, and the Bengali TTF embedded in generated PDFs.
bangla_gpt_api = ["data/sample_nctb/*.md", "data/kg/*.json", "data/fonts/*.ttf"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
per-file-ignores = { "tests/test_phase1_exploits.py" = ["B011"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "skipif: conditional skip (pytest.mark.skipif)",
    "integration: slow integration tests requiring external services",
]

[tool.coverage.run]
source = ["bangla_gpt_api"]
omit = [
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ ==",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["alembic"]

# bijoy2unicode ships no stubs/py.typed (import-untyped at the lazy import in
# nctb/bijoy.py); silence that code at the single import site.
[[tool.mypy.overrides]]
module = "bangla_gpt_api.nctb.bijoy"
disable_error_code = "import-untyped"
