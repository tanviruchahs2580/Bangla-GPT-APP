[project]
name = "bangla-gpt-api"
version = "0.9.2"
description = "Bangla GPT APP - NCTB-grounded AI tutor platform (API service)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bangla GPT APP contributors" }]
keywords = [
    "education",
    "bengali",
    "nctb",
    "tutor",
    "rag",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Bengali",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "uvicorn-worker>=0.2",
    # SCS-06: pydantic and starlette are imported directly across the codebase,
    # so they are declared rather than relied on transitively via fastapi.
    "pydantic>=2.7",
    "starlette>=0.37",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "alembic>=1.13",
    "prometheus-client>=0.21",
    "pypdf>=5.0",
    # AUD-A2-17: chat-image sanitizing (EXIF/PNG metadata strip + re-encode,
    # blur/blank quality gate) imports PIL lazily in
    # providers/image_safety.py. Declared because deptry checks the import
    # against this manifest; the gate degrades to an honest
    # "image_unreadable" refusal if the import ever fails at runtime.
    "pillow>=11.0",
    "bijoy2unicode>=0.1.1",
    # The ceiling is arq's, not ours: arq (0.28.0, the newest release) requires
    # `redis[hiredis]<6`, so no redis 6/7/8 can be installed beside it. Spelling
    # that out here is what makes the manifest satisfiable and stops a resolver
    # from proposing redis 8.1.0 -- which is how the dependency-update queue
    # went red and stopped landing updates in the first place. Re-check the
    # bound when arq widens its range:
    #   python -c "import importlib.metadata as m; print(m.requires('arq'))"
    "redis>=5.0,<6",
    "arq>=0.26",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.0",
    # I-03 (AUD-HI-04): OpenTelemetry. API/SDK/exporter share the 1.x release
    # train; the instrumentation packages are published as 0.x betas that must
    # match the API minor (0.66b1 <-> 1.45). The SQLAlchemy instrumentor is
    # declared for the day it accepts SQLAlchemy 2.1 (today it declines at
    # 2.1.4 and tracing falls back to engine events, see below) -- keeping it
    # in the manifest means the upgrade is a version bump, not a code change.
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<0.67",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
    "opentelemetry-exporter-otlp>=1.45,<2",
    "fpdf2>=2.8.3",
    # fpdf2 declares uharfbuzz only as a *test* extra, but it is a RUNTIME
    # requirement for this project: services/qp_pdf.py calls
    # set_text_shaping(True) at two sites, and that is what turns Bengali
    # conjuncts into shaped glyphs instead of decomposed sequences with
    # detached vowel signs. Without it fpdf raises FPDFException at the
    # first PDF. Declared here deliberately; do not remove.
    "uharfbuzz>=0.40",
    # S5.6: Fernet encryption for guardian phone at rest (security.py).
    "cryptography>=42",
    # SEC-02: Argon2id password hashing (OWASP-recommended parameters).
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  # The quality ratchet imports radon directly (scripts/check_quality_ratchet.py),
  # and the dependency-hygiene gate correctly flagged the undeclared import in
  # CI. vulture and deptry are only ever shelled out to, so declaring them here
  # would trip the same gate from the other side; the CI step installs them.
  "radon>=6.0.1",
  # scripts/check_lockfile.py compares declared specifiers against the pinned
  # lock with packaging's Requirement/SpecifierSet; deptry flags the undeclared
  # import wherever the project's own environment is not installed (CI).
  "packaging>=24",
  # E-11: property-based tests for the Bangla normalizer, the BM25 tokenizer,
  # the chunker and the citation parser (apps/api/tests/test_e2_property_based.py).
  # Test-only: never imported by `src`, so it stays out of the runtime image.
  "hypothesis>=6.168.4,<7",
  # E-04: bounded mutation sampling of critical modules (nightly job in
  # .github/workflows/nightly.yml; see .audit/handoffs/workflows-e2.md).
  # Linux/macOS only -- mutmut refuses native Windows (use WSL or the
  # container), which is why this is a dev extra and never a runtime dep.
  "mutmut>=3.8.0,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The wheel must ship every data file the runtime loads by path: sample corpus,
# the S5 knowledge graph, and the Bengali TTF embedded in generated PDFs. The
# font's SIL OFL licence travels with it (OFL-1.1 requires the licence to
# accompany every copy).
bangla_gpt_api = [
    "data/sample_nctb/*.md",
    "data/kg/*.json",
    "data/fonts/*.ttf",
    "data/fonts/OFL.txt",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
# Families added in CQ-01, each with the violations it surfaces either fixed
# at the call site or justified below. C90 (complexity) is deliberately NOT
# here yet: it is the subject of the CQ-03 refactor, and enabling it before
# that refactor would only red the build. It lands with a ratcheted max.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit - security-relevant, worth the false positives
    "DTZ",  # naive datetime hazards
    "T20",  # stray print()
    "ERA",  # commented-out code
    "SIM",  # simplifications
    "RUF",  # ruff-specific correctness
    "PERF", # obvious performance traps
    "ASYNC",# async footguns
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
]
# Every entry is a deliberate decision, not a backlog:
#   E501            - line length is enforced by `ruff format`, which does not
#                     produce unreadable wrapping; duplicating it as a lint
#                     rule only creates conflicts with the formatter.
#   RUF001/002/003  - "ambiguous" unicode. Bengali legitimately uses these
#                     code points (Bengali digits, the U+09DC/U+09DD nukta
#                     forms); flagging them would force the product's own
#                     script to be escaped. The Bangla hygiene scanner
#                     (scripts/bn_scan.py) is the check that matters here.
#   N818            - exception naming. The codebase has established
#                     `CacheUnavailable`, `OcrUnavailable`,
#                     `ProviderNotConfigured`; renaming them would churn
#                     every call site and test to satisfy a style rule.
#   N813            - the one camelcase import is a deliberate alias for a
#                     lazily imported class, so the local name is lowercase.
#   T201 (cli)     - `src/bangla_gpt_api/evaluation/cli.py` is a command-line
#                     tool; printing is its entire output contract.
#   B011 (tests)    - test_phase1_exploits.py asserts that `assert False` and
#                     friends are caught by static analysis. Removing the
#                     literals would delete the test's subject matter.
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "N818",
    "N813",
    # DTZ001/DTZ901 want tz-aware datetimes. This project stores naive UTC on
    # purpose - SQLite has no timezone type and the schema reads naive - so
    # "fixing" these would mix aware and naive values and raise TypeError at
    # comparison time. The rest of DTZ stays on (DTZ005, DTZ011, DTZ007 ...).
    "DTZ001",
    "DTZ901",
    # RUF100 reports noqa comments that ARE load-bearing: a suppression placed
    # on a name inside a parenthesised `from x import (...)` block is reported
    # by F401 against that name's column, and RUF100 fails to map it back.
    # Verified by stripping the suppressions: F401 then fires. Enabling RUF100
    # would delete working suppressions, so it stays off.
    "RUF100",
    # ERA001 reads this codebase's formula and pseudo-code comments (how a
    # confidence score is computed, what a lifespan step does) as commented-out
    # code. All five hits are documentation, not dead code.
    "ERA001",
    # PERF401 rewrites `for ..: out.append(f(x))` into a comprehension. That is
    # a style preference with no measurable effect at this scale, and it would
    # mean rewriting twelve working code paths for no behavioural gain. The
    # rest of PERF stays on (PERF403 and friends do catch real waste).
    "PERF401",
]
# TOML has no comments inside an inline table, so the rationale lives here and
# the table itself stays bare.
#
#   evaluation/cli.py  it is a CLI; printing is its output contract
#   scripts/*         command-line tooling: printing is the output contract,
#                     the gate scripts assert their own preconditions, and the
#                     eval harness uses subprocesses and random sampling
#   tests/test_phase1_exploits.py
#                     asserting that static analysis catches `assert False`
#                     requires writing it
#   tests/*           `assert` IS the mechanism in a test, and fixture
#                     credentials, literal SQL, subprocess calls, prints in
#                     diagnostics and unused unpacked fixtures are how tests
#                     are written; ASYNC240: the Alembic evaluation test
#                     declares `async def` for the shared client fixture, then
#                     reads its sample file synchronously; the call is on a
#                     tmp_path, not an event-loop blocking risk.
[tool.ruff.lint.per-file-ignores]
"src/bangla_gpt_api/evaluation/cli.py" = ["T201"]
"scripts/*" = ["T201", "S101", "S603", "S311", "S607", "S404"]
"tests/test_phase1_exploits.py" = ["B011"]
# Vulture's de-facto whitelist format: bare names mark symbols as used, so
# this file is undefined names and useless expressions by construction. It is
# the input to the dead-code gate (check_quality_ratchet.py), not app code.
"quality-baselines/vulture_whitelist.py" = ["B018", "F821"]
"tests/*" = [
    "S101",    # assert used
    "S105",    # hardcoded password (fixture strings)
    "S106",    # hardcoded password argument (fixture strings)
    "S311",    # random (shuffling fixtures)
    "S608",    # SQL string construction (asserted against injection)
    "S603",    # subprocess call (test tooling)
    "T201",    # print() in test diagnostics
    "T203",    # pdb
    "ASYNC240",
    "RUF059",  # unused unpacked variable in fixtures
    "SIM117",  # nested with statements in fixtures
]

# ---------------------------------------------------------------------------
# E-04 / TST-05: mutation testing. Bounded on purpose -- mutmut is a sampler
# here, not a full-suite gate: one critical module per nightly run, with the
# score reported so a regression is visible without spending an hour.
#
# Run (Linux; `python -m mutmut`):
#   python -m mutmut run --max-children 4
#   python -m mutmut results
#   python -m mutmut export-cicd-stats
#
# To move the sampled module, change `source_paths` and
# `pytest_add_cli_args_test_selection` together.
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src/bangla_gpt_api/auth/single_use.py"]
pytest_add_cli_args_test_selection = ["tests/test_single_use_tokens.py"]
also_copy = ["tests/", "pyproject.toml"]
use_git_change_detection = false
mutate_only_covered_lines = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "skipif: conditional skip (pytest.mark.skipif)",
    "integration: slow integration tests requiring external services",
]

[tool.coverage.run]
source = ["bangla_gpt_api"]
omit = [
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
# Coverage was measured but never gated: fail_under was 0, no CI job passed
# --cov, and pytest-cov was not even a declared dev dependency, so the number
# could not be reproduced from the declared environment. Baseline measured
# 87.62% on 2026-10-09; 80 is set with headroom so this gate is about catching
# regressions, not about pretending the gap is closed. Per-module floors for
# the critical paths are the follow-up (TST-04).
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ ==",
]

[tool.deptry]
# CQ-03: without this, deptry does not recognise the project's own package as
# first party and reports every `from bangla_gpt_api... import ...` as
# "DEP003 imported but it is a transitive dependency" -- 392 findings (of 404)
# on this tree, which buried the real ones. The distribution is
# `bangla-gpt-api`, the import package is `bangla_gpt_api` under src/, and
# deptry resolves first-party packages from `[project] name`/src layout only
# when told the module name explicitly.
#
# Still reported, deliberately not silenced here:
#   DEP002 - gunicorn, uvicorn-worker, psycopg, uharfbuzz (used through the
#            Dockerfile CMD / SQLAlchemy driver URL / fpdf2 runtime shaping,
#            never via an `import` deptry can see), and the dev tools
#            (pytest*, ruff, mypy, pip-audit) that are executed, not imported.
#   DEP001 - `_changelog_common`, a sibling module of the scripts in
#            apps/api/scripts/ imported through a sys.path insert (its own
#            module, not a distribution). Add it to known_first_party if
#            deptry is ever wired into CI.
known_first_party = ["bangla_gpt_api", "_changelog_common"]

# Import-name to distribution-name mappings deptry cannot infer without the
# project's environment installed. Locally the venv resolves them; in CI's
# guardrails job (which installs only the ratchet tools) the same imports were
# reported as DEP001 and their distributions as DEP002, so the mapping is
# spelled out here and the deps gate behaves identically in both places.
[tool.deptry.package_module_name_map]
"pyjwt" = "jwt"
"argon2-cffi" = "argon2"
"fpdf2" = "fpdf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["alembic"]

# CQ-02: strictness is turned on per-flag, not all at once, because a single
# `--strict` jump would have required rewriting 161 annotations and 24
# signatures in one commit. Every flag below is on because the codebase
# already satisfies it; the measured path to full `--strict` is written down in
# docs/type-checking-plan.md, including which flags are still off and why.
warn_unused_configs = true      # a [[overrides]] block that matches nothing
warn_redundant_casts = true     # a cast that changes nothing
warn_unused_ignores = true      # dead suppressions (AUD-0018's failure mode)
warn_return_any = true          # a function whose `Any` return hides the contract
no_implicit_optional = true     # `x: int = None` is not an int
strict_equality = true          # silent True/1 equality across types
check_untyped_defs = true       # bodies of untyped functions are still checked
warn_unreachable = true         # dead code after a terminating branch
no_implicit_reexport = true     # `import x` must say `from x import y as y`
strict_bytes = true

# Still off globally, deliberately. The stale 2026-10-10 counts that used to
# live here (disallow_any_generics 161, disallow_untyped_defs 24) drift as
# modules are ratcheted, so the current measurement and the remaining-gap
# state live in docs/type-checking-plan.md instead of being restated here. Modules
# that already pass --strict are listed in the override block at the end of
# this file; removing any flag from that block is a deliberate act, and the
# plan records the mechanism and the measured numbers.

# bijoy2unicode ships no stubs/py.typed (import-untyped at the lazy import in
# nctb/bijoy.py); silence that code at the single import site.
[[tool.mypy.overrides]]
module = "bangla_gpt_api.nctb.bijoy"
disable_error_code = "import-untyped"

# ---- AUD-CD-10 ratchet: enforce --strict for modules that already pass it ----
# `strict = true` inside [[tool.mypy.overrides]] applies GLOBALLY in mypy 2.4.0
# (set_strict_flags mutates the global Options), so the per-module flags it
# expands to are listed explicitly for these modules instead.
# warn_redundant_casts and no_implicit_reexport are global-only options, already
# on in [tool.mypy] above, so this set is equivalent to --strict here.
[[tool.mypy.overrides]]
module = [
    "bangla_gpt_api",
    "bangla_gpt_api.auth",
    "bangla_gpt_api.caching",
    "bangla_gpt_api.config",
    "bangla_gpt_api.data",
    "bangla_gpt_api.db",
    "bangla_gpt_api.evaluation",
    "bangla_gpt_api.ingestion",
    "bangla_gpt_api.initialize",
    "bangla_gpt_api.jobs",
    "bangla_gpt_api.main",
    "bangla_gpt_api.metrics",
    "bangla_gpt_api.nctb",
    "bangla_gpt_api.providers",
    "bangla_gpt_api.retrieval",
    "bangla_gpt_api.routers",
    "bangla_gpt_api.services",
    "bangla_gpt_api.auth.mfa",
    "bangla_gpt_api.curriculum.*",
    "bangla_gpt_api.curriculum",
    "bangla_gpt_api.db.base",
    "bangla_gpt_api.db.clock",
    "bangla_gpt_api.evaluation.cost_model",
    "bangla_gpt_api.evaluation.retrieval_strata",
    "bangla_gpt_api.evaluation.thresholds",
    "bangla_gpt_api.ingestion.*",
    "bangla_gpt_api.initialize.dependencies",
    "bangla_gpt_api.initialize.middleware_stack",
    "bangla_gpt_api.initialize.observability",
    "bangla_gpt_api.initialize.schedulers",
    "bangla_gpt_api.nctb.manifest",
    "bangla_gpt_api.nctb.normalize",
    "bangla_gpt_api.nctb.sources",
    "bangla_gpt_api.providers.image_safety",
    "bangla_gpt_api.retrieval.*",
    "bangla_gpt_api.routers._error_contract",
    "bangla_gpt_api.routers.assessment",
    "bangla_gpt_api.routers.learn",
    "bangla_gpt_api.routers.school",
    "bangla_gpt_api.routers.system",
    "bangla_gpt_api.routers.teacher",
    "bangla_gpt_api.routers.workspace",
    "bangla_gpt_api.routers.school.*",
    "bangla_gpt_api.services.activity",
    "bangla_gpt_api.services.answer_structure",
    "bangla_gpt_api.services.atrisk",
    "bangla_gpt_api.services.breached_passwords",
    "bangla_gpt_api.services.context",
    "bangla_gpt_api.services.coverage",
    "bangla_gpt_api.services.generators",
    "bangla_gpt_api.services.mailer",
    "bangla_gpt_api.services.numeric_check",
    "bangla_gpt_api.services.parent_digest",
    "bangla_gpt_api.services.pii",
    "bangla_gpt_api.services.question_bank",
    "bangla_gpt_api.services.quiz_explain",
    "bangla_gpt_api.services.retention",
    "bangla_gpt_api.services.router",
    "bangla_gpt_api.services.safety",
    "bangla_gpt_api.services.teach_strategy",
    "bangla_gpt_api.services.trace_meta",
    "bangla_gpt_api.services.verification",
    "bangla_gpt_api.services.weakness",
    "bangla_gpt_api.services.generators.question_paper",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true
